<canvas id="c" aria-hidden="true"></canvas>
<canvas id="ov" aria-label="World map. Pick a tool below and touch the map to use it."></canvas>
<canvas id="mini" aria-label="Minimap. Touch to jump to that part of the world."></canvas>

<div id="hud">
  <div id="stamp" class="plate"><span id="era">Tiny Dominion</span><b id="year">Year 1</b></div>
  <button id="realmBtn" class="plate" aria-expanded="false" aria-controls="sheet">
    <b id="pop">0 people</b><span id="realmCount">No realms yet</span>
  </button>
  <div id="speed" role="group" aria-label="Game speed">
    <button data-s="0" aria-pressed="false" aria-label="Pause">II</button>
    <button data-s="1" aria-pressed="true">1x</button>
    <button data-s="3" aria-pressed="false">3x</button>
    <button data-s="8" aria-pressed="false">8x</button>
    <button data-s="20" aria-pressed="false" aria-label="20 times speed">20x</button>
  </div>
</div>

<section id="sheet" class="plate" hidden>
  <header><button id="sheetBack" hidden>Back</button><h2 id="sheetTitle">Realms</h2><button id="sheetClose">Close</button></header>
  <div id="sheetBody"></div>
</section>

<div id="banner" aria-live="polite"><small id="bannerKicker"></small><b id="bannerTitle"></b><span id="bannerSub"></span></div>
<button id="stopWatch" class="act" hidden>Stop watching</button>
<button id="exit3d" class="act" hidden>Back to the map</button>
<div id="veil"><div class="plate"><b id="veilTitle">Shaping the world</b><span id="veilText"></span>
  <div id="veilBtns" class="btnrow" hidden><button id="vCont" class="act">Continue</button> <button id="vNew" class="act">New world</button></div></div></div>

<div id="bottom">
  <div id="log" aria-live="polite"></div>
  <div id="info" class="plate" hidden></div>
  <div id="dock">
    <div id="brushRow" hidden>
      <label for="brush">Brush size</label>
      <input id="brush" type="range" min="1" max="8" value="2">
      <output id="brushVal" for="brush">2</output>
    </div>
    <div id="strRow" class="slideRow" hidden>
      <label for="strength">Strength</label>
      <input id="strength" type="range" min="1" max="10" value="5">
      <output id="strVal" for="strength">5</output>
    </div>
    <div id="reliefRow" class="slideRow" hidden>
      <label for="reliefIn">Relief</label>
      <input id="reliefIn" type="range" min="4" max="40" value="20">
      <output id="reliefVal" for="reliefIn">2.0x</output>
    </div>
    <div id="seaRow" class="slideRow" hidden>
      <label for="seaIn">Sea level</label>
      <input id="seaIn" type="range" min="-18" max="18" value="0">
      <output id="seaVal" for="seaIn">0 m</output>
    </div>
    <div id="climRow" class="slideRow" hidden>
      <label for="climIn">Temperature</label>
      <input id="climIn" type="range" min="-6" max="8" step="0.5" value="0">
      <output id="climVal" for="climIn">0 &deg;C</output>
    </div>
    <div id="climBtns" class="climBtns" hidden>
      <button id="meltBtn" class="act">Melt the ice caps</button><button id="iceBtn" class="act">Ice age</button><button id="climReset" class="act">Restore</button>
      <p id="climInfo"></p>
    </div>
    <div id="tools" role="toolbar" aria-label="Tools"></div>
    <div id="tabs" role="tablist" aria-label="Tool groups"></div>
  </div>
</div>
