<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Dominion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sea:#184074;--panel:#d7ebe4;--panel-2:#bfdcd3;--ink:#12263f;--muted:#4d6577;--sun:#ffd23f;--sun-ink:#12263f;--shadow:#0b1828;--hot:#b3261e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--panel:#15263d;--panel-2:#1f3552;--ink:#dcefe9;--muted:#8fa9b8;--shadow:#050b14;--hot:#ff8a7a;}
}
:root[data-theme="dark"]{--panel:#15263d;--panel-2:#1f3552;--ink:#dcefe9;--muted:#8fa9b8;--shadow:#050b14;--hot:#ff8a7a;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--sea);color:var(--ink);
  font-family:"Pixelify Sans",ui-monospace,"Courier New",monospace;
  font-size:15px;line-height:1.25;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;pointer-events:none;image-rendering:pixelated}
canvas#ov{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
.plate{background:var(--panel);border:2px solid var(--ink);box-shadow:0 3px 0 var(--shadow)}

#hud{position:fixed;top:0;left:0;right:0;z-index:3;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 0;display:flex;gap:6px;align-items:stretch;pointer-events:none}
#hud > *{pointer-events:auto}
#stamp{padding:4px 8px;display:flex;flex-direction:column;justify-content:center;flex:0 0 auto}
#stamp b{font-weight:700;font-size:15px;white-space:nowrap}
#stamp span{font-size:11px;color:var(--muted);white-space:nowrap}
#realmBtn{min-width:0;overflow:hidden;padding:4px 8px;display:flex;flex-direction:column;justify-content:center;text-align:left;min-height:44px}
#realmBtn b{font-size:15px;font-weight:600;white-space:nowrap}
#realmBtn span{font-size:12px;color:var(--muted);white-space:nowrap}
#speed{margin-left:auto;display:flex}
#speed button{min-width:30px;min-height:44px;padding:0 4px;background:var(--panel);border:2px solid var(--ink);border-left-width:0;box-shadow:0 3px 0 var(--shadow);font-weight:600}
#speed button:first-child{border-left-width:2px}
#speed button[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink)}

#mini{position:fixed;z-index:2;right:8px;top:calc(64px + env(safe-area-inset-top,0px));border:2px solid var(--ink);box-shadow:0 3px 0 var(--shadow);background:var(--sea);touch-action:none;cursor:crosshair}
#mini[hidden]{display:none}

#sheet{position:fixed;z-index:5;left:8px;right:8px;top:calc(64px + env(safe-area-inset-top,0px));bottom:calc(168px + env(safe-area-inset-bottom,0px));max-width:460px;display:flex;flex-direction:column}
#sheet[hidden]{display:none}
#sheet header{display:flex;align-items:center;gap:6px;padding:8px;border-bottom:2px solid var(--ink)}
#sheet h2{font-size:18px;margin:0;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet header button{min-width:52px;min-height:38px;padding:0 8px;background:var(--panel-2);border:2px solid var(--ink)}
#sheet header button[hidden]{display:none}
#sheetBody{overflow-y:auto;padding:8px 8px 14px;flex:1;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#sheetBody h3{font-size:15px;font-weight:700;margin:14px 0 6px}
#sheetBody h3:first-child{margin-top:2px}
.note{margin:6px 2px;font-size:14px}
.fine{margin:6px 2px 0;font-size:12px;color:var(--muted)}
.act{min-height:44px;padding:0 14px;background:var(--sun);color:var(--sun-ink);border:2px solid var(--ink);box-shadow:0 3px 0 var(--shadow);font-weight:700}
.act:active{transform:translateY(3px);box-shadow:none}
.btnrow{margin-top:10px}
.realm{display:grid;grid-template-columns:18px 1fr auto;column-gap:8px;align-items:center;width:100%;text-align:left;background:var(--panel-2);border:2px solid var(--ink);padding:6px 8px;margin-top:6px;min-height:48px}
.realm i{width:18px;height:18px;border:2px solid var(--ink);grid-row:span 2}
.realm.slim{min-height:40px}
.realm.slim i{grid-row:auto}
.realm .rn{font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.realm .rs{font-size:12px;text-align:right}
.realm .rs.hot{color:var(--hot);font-weight:700}
.realm .rm{font-size:12px;color:var(--muted);grid-column:2 / span 2}
.realm .rg{font-style:italic;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal{margin:6px 2px 2px;font-size:14px;font-weight:700}
.char{margin:0 2px 8px;font-size:13px;color:var(--muted)}
.temper{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:5px 8px;align-items:center;font-size:12px}
.temper .meter{margin:0;height:9px;min-width:40px;position:relative}
.temper .meter s{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1px;background:var(--ink)}
.sub{margin:12px 2px 0;font-size:14px;font-weight:700}
.opt{background:var(--panel-2);border:2px solid var(--ink);padding:6px 8px;margin-top:6px}
.opt.chosen{box-shadow:inset 5px 0 0 var(--sun);padding-left:12px}
.opt .ol{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}
.opt .ol small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.opt .ol em{font-style:normal;font-size:11px;font-weight:700;background:var(--sun);color:var(--sun-ink);border:2px solid var(--ink);padding:0 4px;white-space:nowrap}
.ub{position:relative;height:9px;border:2px solid var(--ink);background:var(--panel);margin:5px 0 3px}
.ub i{display:block;height:100%;background:var(--ink)}
.ub i.neg{background:var(--muted);opacity:.55}
.ub s{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1px;background:var(--hot)}
.why{margin:2px 0 0;font-size:12px;line-height:1.5}
.why span{white-space:nowrap;margin-right:6px}
.why .fn{color:var(--muted)}
.mem{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;font-size:13px;padding:5px 0;border-bottom:2px solid var(--panel-2)}
.mem i{width:14px;height:14px;border:2px solid var(--ink)}
.mem .lvl{font-size:12px;color:var(--muted);text-align:right}
.mem.bad .lvl{color:var(--hot);font-weight:700}
.whisper{display:flex;flex-wrap:wrap;gap:6px}
.whisper .act{flex:1 1 0;min-width:96px;padding:0 6px;font-size:13px}
.rhead{display:flex;gap:10px;align-items:center}
.rhead i{flex:0 0 28px;height:28px;border:2px solid var(--ink)}
.rhead b{display:block;font-size:16px}
.rhead small{display:block;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 6px}
.stats div{background:var(--panel-2);border:2px solid var(--ink);padding:4px 6px}
.stats dt{font-size:11px;color:var(--muted)}
.stats dd{margin:0;font-size:16px;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0;flex-wrap:wrap}
.row > span,.row > label{font-size:14px}
.opts{display:flex}
.opts button{min-height:38px;padding:0 9px;background:var(--panel-2);border:2px solid var(--ink);margin-left:-2px;font-size:13px}
.opts button:first-child{margin-left:0}
.opts button[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink);font-weight:700}
input[type="text"],textarea{font:inherit;color:var(--ink);background:var(--panel-2);border:2px solid var(--ink);padding:8px;-webkit-user-select:text;user-select:text;border-radius:0}
input[type="text"]{width:190px;max-width:60%}
textarea{width:100%;resize:vertical;display:block;margin-bottom:8px}
::placeholder{color:var(--muted);opacity:1}
.ev{display:grid;grid-template-columns:68px 1fr;gap:8px;padding:5px 0 5px 8px;border-left:4px solid var(--panel-2);margin-bottom:4px}
.ev span{font-size:12px;color:var(--muted);padding-top:1px}
.ev p{margin:0;font-size:14px}
.ev.t-war{border-left-color:#e5484d}.ev.t-peace{border-left-color:#3aa76d}
.ev.t-disaster{border-left-color:#ff7a2e}.ev.t-tech{border-left-color:#17c3b2}
.ev.go{cursor:pointer}.ev.go:hover p{text-decoration:underline}
.ev .go-ico{font-size:11px;color:var(--muted)}.ev.t-age{border-left-color:#3e7bfa}.ev.t-ruler{border-left-color:#a05cf0}.ev.t-ruin{border-left-color:#6b625a}

#veil{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:var(--sea)}
#veil[hidden]{display:none}
#veil .plate{padding:14px 18px;text-align:center;min-width:220px}
#veil b{display:block;font-size:18px}
#veil span{display:block;font-size:13px;color:var(--muted);margin-top:4px;min-height:1.2em}
#veilBtns[hidden]{display:none}
#veilBtns{display:flex;gap:8px;justify-content:center;margin-top:12px}
#info{pointer-events:auto}

#bottom{position:fixed;left:0;right:0;bottom:0;z-index:3;display:flex;flex-direction:column;pointer-events:none}
#log{padding:0 8px 6px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
#log div{background:var(--shadow);color:#e8f4ef;padding:3px 8px;font-size:13px;max-width:100%;border-left:4px solid #6b8296;transition:opacity .6s}
#log div.out{opacity:0}
#log .t-war{border-left-color:#ff6b5e}#log .t-peace{border-left-color:#6fdc9a}
#log .t-disaster{border-left-color:#ffa04a}#log .t-tech{border-left-color:#5fe0d2}#log .t-age{border-left-color:#7fb0ff}#log .t-ruler{border-left-color:#c79bff}
#info{margin:0 8px 8px;padding:6px 10px;font-size:14px;align-self:flex-start;max-width:calc(100% - 16px)}
#info b{font-weight:700}
#info small{display:block;color:var(--muted);font-size:12px}
#dock{pointer-events:auto;background:var(--panel);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom,0px)}
#brushRow{display:flex;align-items:center;gap:10px;padding:6px 12px 0;font-size:13px}
#brushRow input{flex:1;accent-color:var(--ink);height:28px;margin:0}
#brushRow output{min-width:1.5ch;text-align:right;font-weight:700}
#brushRow[hidden],.slideRow[hidden]{display:none}
.slideRow{display:flex;align-items:center;gap:10px;padding:6px 12px 0;font-size:13px}
.slideRow input{flex:1;accent-color:var(--ink);height:28px;margin:0}
.slideRow output{min-width:5ch;text-align:right;font-weight:700}
#tools{display:flex;gap:6px;overflow-x:auto;padding:8px 8px 10px;scrollbar-width:none;touch-action:pan-x}
#tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;min-width:62px;height:58px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:var(--panel-2);border:2px solid var(--ink);box-shadow:0 3px 0 var(--shadow);font-size:12px;white-space:nowrap}
.tool .ico{font-size:21px;line-height:1;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tool .sw{width:24px;height:20px;border:2px solid var(--ink)}
.tool[aria-pressed="true"]{background:var(--sun);color:var(--sun-ink);box-shadow:none;transform:translateY(3px)}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:2px solid var(--ink)}
#tabs button{min-height:44px;background:transparent;border:0;border-left:2px solid var(--ink);font-weight:600;font-size:15px;padding:0 2px}
#tabs button:first-child{border-left:0}
#tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel)}
.meter{height:10px;background:var(--panel-2);border:2px solid var(--ink);margin:4px 0 2px}
.meter i{display:block;height:100%;background:var(--sun)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.chips span{font-size:12px;padding:1px 6px;border:2px solid var(--ink);background:var(--panel-2)}
.chips span.new{background:var(--sun);color:var(--sun-ink)}
.town{display:grid;grid-template-columns:1fr auto;width:100%;text-align:left;background:var(--panel-2);border:2px solid var(--ink);padding:4px 8px;margin-top:4px;min-height:40px;align-items:center}
.town b{font-size:14px}.town small{font-size:12px;color:var(--muted);text-align:right}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:4px 0 10px}
.tiles div{background:var(--panel-2);border:2px solid var(--ink);padding:6px 8px}
.tiles dt{font-size:12px;color:var(--muted)}.tiles dd{margin:0;font-size:22px;font-weight:700}
.chart{position:relative;margin:4px 0 6px}
.chart canvas{display:block;width:100%;height:230px;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--shadow);color:#e8f4ef;font-size:12px;padding:4px 6px;white-space:nowrap;z-index:2}
.tip i{display:inline-block;width:8px;height:8px;margin-right:4px;border:1px solid #e8f4ef}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;margin:2px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:4px;display:inline-block;outline:1px solid var(--ink)}
table.lead{width:100%;border-collapse:collapse;font-size:13px}
table.lead th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;border-bottom:2px solid var(--ink);padding:3px 4px}
table.lead td{padding:3px 4px;border-bottom:1px solid var(--panel-2)}
table.lead td.n{text-align:right;font-variant-numeric:tabular-nums}
#stopWatch{position:fixed;z-index:4;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px))}
body.watching #dock,body.watching #info{display:none}
body.watching #stopWatch{display:block}
#exit3d{position:fixed;z-index:4;right:8px;top:calc(64px + env(safe-area-inset-top,0px))}
body.v3d #exit3d{display:block}
body.v3d #mini,body.v3d #info{display:none}
body.v3d #banner{top:calc(124px + env(safe-area-inset-top,0px))}
#info .act{min-height:36px;margin-top:6px;padding:0 10px;font-size:13px}
#banner{position:fixed;z-index:4;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);text-align:center;pointer-events:none;
  background:rgba(11,24,40,.82);color:#fff6d6;border:2px solid var(--sun);box-shadow:0 3px 0 var(--shadow);padding:10px 22px 12px;max-width:calc(100% - 24px);transition:opacity .8s}
#banner{opacity:0}#banner.on{opacity:1}
#banner small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--sun)}
#banner b{display:block;font-size:30px;line-height:1.1;margin:2px 0}
#banner span{display:block;font-size:14px;color:#cfe3dc}
@media (max-width:440px){#banner b{font-size:22px}}
@media (max-width:440px){
  #hud{gap:4px;padding-left:6px;padding-right:6px}
  #stamp{padding:3px 6px}#stamp b{font-size:13px}#stamp span{font-size:10px}
  #realmBtn{padding:3px 6px;flex:1 1 auto}#realmBtn b{font-size:13px}#realmBtn span{font-size:11px}
  #speed button{min-width:27px;font-size:12px;padding:0 2px}
}
@media (min-width:700px){
  #dock{margin:0 auto 10px;border:2px solid var(--ink);box-shadow:0 3px 0 var(--shadow);width:660px;max-width:calc(100% - 20px)}
  #log,#info{margin-left:calc(50% - 330px)}
  #sheet{bottom:190px}
}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<canvas id="ov" aria-label="World map. Pick a tool below and touch the map to use it."></canvas>
<canvas id="mini" aria-label="Minimap. Touch to jump to that part of the world."></canvas>

<div id="hud">
  <div id="stamp" class="plate"><span id="era">Tiny Dominion</span><b id="year">Year 1</b></div>
  <button id="realmBtn" class="plate" aria-expanded="false" aria-controls="sheet">
    <b id="pop">0 people</b><span id="realmCount">No realms yet</span>
  </button>
  <div id="speed" role="group" aria-label="Game speed">
    <button data-s="0" aria-pressed="false" aria-label="Pause">II</button>
    <button data-s="1" aria-pressed="true">1x</button>
    <button data-s="3" aria-pressed="false">3x</button>
    <button data-s="8" aria-pressed="false">8x</button>
    <button data-s="20" aria-pressed="false" aria-label="20 times speed">20x</button>
  </div>
</div>

<section id="sheet" class="plate" hidden>
  <header><button id="sheetBack" hidden>Back</button><h2 id="sheetTitle">Realms</h2><button id="sheetClose">Close</button></header>
  <div id="sheetBody"></div>
</section>

<div id="banner" aria-live="polite"><small id="bannerKicker"></small><b id="bannerTitle"></b><span id="bannerSub"></span></div>
<button id="stopWatch" class="act" hidden>Stop watching</button>
<button id="exit3d" class="act" hidden>Back to the map</button>
<div id="veil"><div class="plate"><b id="veilTitle">Shaping the world</b><span id="veilText"></span>
  <div id="veilBtns" class="btnrow" hidden><button id="vCont" class="act">Continue</button> <button id="vNew" class="act">New world</button></div></div></div>

<div id="bottom">
  <div id="log" aria-live="polite"></div>
  <div id="info" class="plate" hidden></div>
  <div id="dock">
    <div id="brushRow" hidden>
      <label for="brush">Brush size</label>
      <input id="brush" type="range" min="1" max="8" value="2">
      <output id="brushVal" for="brush">2</output>
    </div>
    <div id="strRow" class="slideRow" hidden>
      <label for="strength">Strength</label>
      <input id="strength" type="range" min="1" max="10" value="5">
      <output id="strVal" for="strength">5</output>
    </div>
    <div id="reliefRow" class="slideRow" hidden>
      <label for="reliefIn">Relief</label>
      <input id="reliefIn" type="range" min="4" max="40" value="20">
      <output id="reliefVal" for="reliefIn">2.0x</output>
    </div>
    <div id="seaRow" class="slideRow" hidden>
      <label for="seaIn">Sea level</label>
      <input id="seaIn" type="range" min="-18" max="18" value="0">
      <output id="seaVal" for="seaIn">0 m</output>
    </div>
    <div id="tools" role="toolbar" aria-label="Tools"></div>
    <div id="tabs" role="tablist" aria-label="Tool groups"></div>
  </div>
</div>

<script>
(function(){
'use strict';
/* ===== 00-core.js ===== */
const $=id=>document.getElementById(id);
const reduceMotion=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const now=()=>(typeof performance!=='undefined'?performance.now():Date.now());

/* ---------- terrain ---------- */
const DEEP=0,WATER=1,SAND=2,GRASS=3,FOREST=4,HILL=5,MOUNT=6,SNOW=7,LAVA=8,ASH=9,DESERT=10,SAVANNA=11,JUNGLE=12,TUNDRA=13,PINE=14,SWAMP=15,RIVER=16,NT=17;
const TD=[
  {n:'Deep ocean',    c:[24,64,116],  v:4, w:0,b:0,f:0,  burn:0, sp:0,  tree:0},
  {n:'Shallows',      c:[46,116,170], v:6, w:0,b:0,f:0,  burn:0, sp:0,  tree:0},
  {n:'Beach',         c:[230,210,150],v:7, w:1,b:1,f:.2, burn:0, sp:0,  tree:0},
  {n:'Grassland',     c:[124,174,78], v:6, w:1,b:1,f:1,  burn:8, sp:.05,tree:0},
  {n:'Forest',        c:[66,128,60],  v:6, w:1,b:1,f:.8, burn:36,sp:.09,tree:1},
  {n:'Hills',         c:[150,146,100],v:9, w:1,b:1,f:.3, burn:0, sp:0,  tree:0},
  {n:'Mountain',      c:[124,118,114],v:10,w:0,b:0,f:0,  burn:0, sp:0,  tree:0},
  {n:'Snowy peak',    c:[238,242,248],v:4, w:0,b:0,f:0,  burn:0, sp:0,  tree:0},
  {n:'Lava',          c:[255,104,24], v:26,w:0,b:0,f:0,  burn:0, sp:0,  tree:0},

function mkNoise(rnd){
  const p=new Uint8Array(256);for(let i=0;i<256;i++)p[i]=i;
  for(let i=255;i>0;i--){const j=(rnd()*(i+1))|0;const t=p[i];p[i]=p[j];p[j]=t;}
  const lat=(x,y)=>p[(p[x&255]+y)&255]/255;
  return function(x,y){
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    const a=lat(xi,yi),b=lat(xi+1,yi),c=lat(xi,yi+1),d=lat(xi+1,yi+1);
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
  };
}

function flood(dst,land,sizes){
  dst.fill(0);let id=0;
  for(let s=0;s<N;s++){
    if(dst[s])continue;const ts=tile[s];
    if(land?!WALK[ts]:ts>WATER)continue;
    if(id>=65534)break;
    id++;let n=0,cnt=0;bfsQ[n++]=s;dst[s]=id;
    while(n){
      const i=bfsQ[--n],x=i%W,y=(i/W)|0;cnt++;
      for(let k=0;k<8;k++){
        const nx=x+DIRS[k][0],ny=y+DIRS[k][1];if(nx<0||ny<0||nx>=W||ny>=H)continue;
        const j=ny*W+nx;if(dst[j])continue;const tj=tile[j];
        if(land?!WALK[tj]:tj>WATER)continue;
        dst[j]=id;bfsQ[n++]=j;
      }
    }
    if(sizes)sizes[id]=cnt;
  }
}
function computeRegions(){
  flood(region,true,null);flood(wreg,false,wsize);
  /* keep path fields that no changed tile can have touched */
  const ns=regionStamp+1;
  if(!dirtyOver){
    for(let n=1;n<vById.length;n++){
      const v=vById[n];if(!v.alive||!v.flow||v.flowStamp!==regionStamp)continue;
      let hitIt=false;
      for(let m=0;m<dirtyWalk.length;m++){
        const i=dirtyWalk[m],dx=(i%W)-v.x,dy=((i/W)|0)-v.y;
        if(dx>=-FR&&dx<=FR&&dy>=-FR&&dy<=FR){hitIt=true;break;}
      }
      if(!hitIt)v.flowStamp=ns;
    }
  }
  regionStamp=ns;dirtyWalk.length=0;dirtyOver=false;regionsDirty=false;
}

function setTile(i,t,paint){
  const old=tile[i];if(old===t)return;
  tile[i]=t;
  if(paint){
    if(t===GRASS||t===SAND||t===DESERT||t===SAVANNA||t===TUNDRA||t===SWAMP)soil[i]=t;
    else if(t===FOREST||t===JUNGLE){if(soil[i]!==GRASS&&soil[i]!==SWAMP&&soil[i]!==SAVANNA)soil[i]=GRASS;}
    else if(t===PINE){if(soil[i]!==TUNDRA&&soil[i]!==GRASS)soil[i]=GRASS;}
    else if(t===HILL||t===MOUNT||t===SNOW)soil[i]=HILL;
    else if(t<=WATER)soil[i]=SAND;
    elev[i]=Math.max(0,Math.min(255,ELEV0[t]+SL-100));
    road[i]=0;
  }
  const b=bmap[i];
  if(b&&!WALK[t])destroyBld(b);
  if(fire[i]&&!BURN[t]&&!bmap[i])fire[i]=0;
  if(WALK[old]!==WALK[t]){regionsDirty=true;if(dirtyWalk.length<300)dirtyWalk.push(i);else dirtyOver=true;}
  else if((old<=WATER)!==(t<=WATER))regionsDirty=true;
  touch(i);
}

function colorOf(i){
  const t=tile[i],d=TD[t],s=shade[i]*d.v,c0=d.c;
  let r=c0[0]+s,g=c0[1]+s,b=c0[2]+s;
  const x=i%W,y=(i/W)|0;
  if(t<=WATER){
    if(t===DEEP){const dp=(90-elev[i])*.3;r-=dp*.45;g-=dp*.75;b-=dp;}
    else if(landAt(x-1,y)||landAt(x+1,y)||landAt(x,y-1)||landAt(x,y+1)){r+=46;g+=44;b+=30;}
  }else if(t!==LAVA){

    if(a<100)a=100;if(c<100)c=100;
    let L=(c-a)*2.1;if(L>36)L=36;else if(L<-44)L=-44;

    if(t===RIVER){r+=(138-r)*.75;g+=(102-g)*.75;b+=(68-b)*.75;}

  }

    const vid=vown[i];
    if(vid){
      const v=vById[vid];
      if(v&&v.alive){
        const kc2=v.k.rgb,kid=v.k.id;

/* catapults, cannons and later tanks follow the army and batter enemy buildings */
function enemyBldNear(u,r){
  const k=u.k;let best=null,bd=1e9;
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const x=u.x+dx,y=u.y+dy;if(!inB(x,y))continue;
    const b=bmap[y*W+x];if(!b||b.v.k===k||!k.wars.has(b.v.k))continue;
    const d=dx*dx+dy*dy+(b.kind==='hall'?-6:b.kind==='wall'?-3:0);if(d<bd){bd=d;best=b;}
  }
  return best;
}
function updSiege(u,s){
  const k=u.k;
  if(!k||!k.alive){kill(u);return;}
  const home=u.home&&u.home.alive&&u.home.k===k?u.home:k.villages[0];
  if(!k.wars.size){if(Math.random()<.003||!home)kill(u);else if(Math.random()<s.move*.5)stepFlow(u,home);return;}
  if(u.cd<=0){
    const b=enemyBldNear(u,k.age>=7?6:5);
    if(b){
      u.cd=k.age>=7?7:k.age>=5?10:14;u.dir=b.x>=u.x?1:-1;
      const tier=TIER[k.age]||0;
      fx({k:'shot',x:u.x,y:u.y,x2:b.x,y2:b.y,t:8,T:8,s:tier>=3?'shell':'stone'});snd('cannon',u.x,u.y,.7);
      sched.push({t:tick+3,f:'shell',x:b.x,y:b.y,k,d:s.atk*k.pow*(tier>=4?1.6:1)});
      return;
    }
    if(k.age>=7){
      const f=nearest(u,5,o=>hostile(u,o));
      if(f){u.cd=6;u.dir=f.x>=u.x?1:-1;hit(f,s.atk*k.pow*.5,u);fx({k:'arrow',x:u.x,y:u.y,x2:f.x,y2:f.y,t:3,T:3,gun:true});fx({k:'spark',x:u.x,y:u.y,t:2});return;}
    }
    u.cd=4;
  }
  const tv=k.target;
  if(tv&&tv.alive&&k.wars.has(tv.k)&&region[u.y*W+u.x]===region[tv.y*W+tv.x]){if(d2(u,tv)>16&&Math.random()<s.move)stepFlow(u,tv);}
  else if(home&&d2(u,home)>25&&Math.random()<s.move*.5)stepFlow(u,home);
}
/* caravans carry goods between towns along the roads */
function updCaravan(u,s){
  const d=u.dest,k=u.k;
  if(!d||!d.alive||!k||!k.alive||(d.k!==k&&k.wars.has(d.k))){kill(u);return;}
  if(d2(u,d)<=8){
    const g=u.cargo||4;k.gold+=g;
    if(d.k!==k){d.k.gold+=g*.6;setRel(k,d.k,rel(k,d.k)+2);remember(d.k,k,0,.3,'trades with us');}
    if(!u.back&&u.home&&u.home.alive&&u.home!==d){u.back=true;u.dest=u.home;u.cargo=g*.5;}else kill(u);
    return;
  }
  if(Math.random()<s.move*(road[u.y*W+u.x]?1.7:1)){
    const ox=u.x,oy=u.y;stepFlow(u,d);
    if(u.x!==ox)u.dir=u.x>ox?1:-1;
    if(u.x!==ox||u.y!==oy){(u.trail||(u.trail=[])).unshift({x:ox,y:oy});if(u.trail.length>2)u.trail.length=2;}
  }
}
function updDragon(u){
  if(!u.tgt||(Math.abs(u.x-u.tgt.x)<2&&Math.abs(u.y-u.tgt.y)<2)||Math.random()<.008){
    let v=null;
    if(vById.length>1&&Math.random()<.6){
      let bd=1e9;
      for(let n=0;n<6;n++){const c=vById[1+((Math.random()*(vById.length-1))|0)];if(c.alive){const d=d2(c,u);if(d<bd){bd=d;v=c;}}}
    }
    if(v)u.tgt={x:v.x+((Math.random()*9)|0)-4,y:v.y+((Math.random()*9)|0)-4};
    else u.tgt={x:Math.max(0,Math.min(W-1,u.x+((Math.random()*120)|0)-60)),y:Math.max(0,Math.min(H-1,u.y+((Math.random()*120)|0)-60))};
  }
  const dx=Math.sign(u.tgt.x-u.x),dy=Math.sign(u.tgt.y-u.y);
  u.x=Math.max(0,Math.min(W-1,u.x+dx));u.y=Math.max(0,Math.min(H-1,u.y+dy));if(dx)u.dir=dx;
  if(Math.random()<.1){
    const i=u.y*W+u.x;
    if(tile[i]>WATER){
      ignite(i);const j=nbr(i);if(j>=0)ignite(j);
      const v=nearest(u,2,o=>o.t!==DRAGON);if(v)hit(v,30,u);
      fx({k:'boom',x:u.x,y:u.y,r:1.6,t:10,T:10});
      if(Math.random()<.15)snd('roar',u.x,u.y,.8);
    }
  }
}
function canFound(u,i){
  const t=tile[i];
  if(!BUILD[t]||bmap[i]||vown[i])return false;
  if(Math.random()>.05*PREF[u.t][t])return false;
  for(let n=1;n<vById.length;n++){const v=vById[n];if(v.alive&&(v.x-u.x)*(v.x-u.x)+(v.y-u.y)*(v.y-u.y)<MINVD*MINVD)return false;}
  return true;
}
function adjEnemyBld(u,hallOnly){
  const k=u.k;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const x=u.x+dx,y=u.y+dy;if(!inB(x,y))continue;
    const b=bmap[y*W+x];if(!b||b.v.k===k)continue;
    if(hallOnly&&b.kind!=='hall')continue;
    if(k.wars.has(b.v.k))return b;
  }
  return null;
}
function nomad(u,s,i,adult){
  const st=u.settle,settler=!!(st&&st.found);
  if(adult){
    const vid=vown[i];
    if(vid){
      const tv=vById[vid];
      if(!settler&&tv&&tv.alive&&tv.race===u.t&&(!u.k||u.k===tv.k)&&tv.pop<tv.cap){u.v=tv;u.k=tv.k;u.settle=null;tv.pop++;return;}
    }else if((!settler||st.t<90||(u.x-st.x)*(u.x-st.x)+(u.y-st.y)*(u.y-st.y)<=36)&&canFound(u,i)){foundVillage(u);return;}
    if(!st&&(tick+u.id)%25===0){
      let best=null,bd=900;
      for(let n=1;n<vById.length;n++){
        const tv=vById[n];
        if(!tv.alive||tv.race!==u.t||(u.k&&u.k!==tv.k)||tv.pop>=tv.cap)continue;
        const d=(tv.x-u.x)*(tv.x-u.x)+(tv.y-u.y)*(tv.y-u.y);if(d<bd){bd=d;best=tv;}
      }
      if(best)u.settle={x:best.x,y:best.y,t:80,found:false,grp:null};
    }
  }
  if(u.settle){
    if(--u.settle.t<=0)u.settle=null;
    else{
      if(Math.random()<s.move){if(u.settle.grp)stepFlow(u,u.settle.grp);else stepTo(u,u.settle.x,u.settle.y);}
      return;
    }
  }
  if(Math.random()<s.move*.8)wander(u);
}
function rehome(u){
  const k=u.k,v=u.v,reg=region[u.y*W+u.x];
  let best=null,bd=1e9;
  for(const o of k.villages){
    if(region[o.y*W+o.x]!==reg)continue;
    const d=d2(o,u);if(d<bd){bd=d;best=o;}
  }
  v.pop--;
  if(best){u.v=best;best.pop++;}
  else{u.v=null;u.soldier=false;u.settle={x:u.x,y:u.y,t:420,found:true,grp:null};}
}
function soldierMove(u,s,k,tv,mv){
  let b=adjEnemyBld(u,true);
  if(!b&&Math.random()<.15)b=adjEnemyBld(u,false);
  if(b){if(u.cd<=0){u.cd=3;damageBld(b,s.atk*k.pow,u);if(Math.random()<.3)fx({k:'spark',x:b.x,y:b.y,t:4});}return;}
  if(region[u.y*W+u.x]===region[tv.y*W+tv.x]){if(Math.random()<mv)stepFlow(u,tv);return;}
  const port=k.port;
  if(port&&port.alive&&port.k===k&&port.dock&&k.landing){
    const dk=port.dock,dd=(u.x-dk.x)*(u.x-dk.x)+(u.y-dk.y)*(u.y-dk.y);
    if(dd>9&&Math.random()<mv){
      if(flowAt(port,u.x,u.y)<10)stepTo(u,dk.x,dk.y);else stepFlow(u,port);
    }
    return;
  }
  if(Math.random()<mv*.4)wander(u);
}
function updCiv(u,s,i){
  const adult=u.age>=s.adult;
  if(u.sick){
    u.sick--;
    if((tick+u.id)%10===0){
      u.hp-=2;if(u.hp<=0){kill(u);return;}
      const o=nearest(u,2,x=>x.t<=ORC&&!x.sick&&!x.immune);
      if(o&&Math.random()<.3)o.sick=200;
    }
    if(!u.sick)u.immune=true;
  }
  if(adult){
    if((tick+u.id)%(u.k&&u.k.wars.size?3:9)===0)u.foe=nearest(u,7,o=>hostile(u,o));
    let f=u.foe;
    if(f&&(f.dead||f.stowed||d2(u,f)>81))f=u.foe=null;
    if(f){
      const hv=u.v;
      if(hv&&f.k&&u.k&&(u.x-hv.x)*(u.x-hv.x)+(u.y-hv.y)*(u.y-hv.y)<(hv.rad+7)*(hv.rad+7)){u.k.rally=hv;u.k.rallyUntil=tick+220;}
      if(!strikeFoe(u,f,s)&&Math.random()<s.move)stepTo(u,f.x,f.y);
      return;
    }
  }
  const v=u.v;
  if(!v){nomad(u,s,i,adult);return;}
  if(!v.alive){u.v=null;if(u.k&&!u.k.alive)u.k=null;return;}
  const k=u.k,mv=s.move*(road[i]?1.5:1);
  if(u.soldier&&adult){
    const tv=k.target,ry=k.rally;
    const defend=ry&&ry.alive&&ry.k===k&&tick<k.rallyUntil&&region[i]===region[ry.y*W+ry.x]&&d2(u,ry)<8100;
    if(defend&&((u.id&1)||!tv)){
      if(d2(u,ry)>36){if(Math.random()<mv)stepFlow(u,ry);}
      else if(Math.random()<s.move*.5)wander(u);
      return;
    }
    if(tv&&tv.alive&&tv.k!==k&&k.wars.has(tv.k)){soldierMove(u,s,k,tv,mv);return;}
    if(!k.wars.size)u.soldier=false;
  }
  const dd=(u.x-v.x)*(u.x-v.x)+(u.y-v.y)*(u.y-v.y),R=v.rad+3;
  if(dd>R*R){
    if((tick+u.id)%40===0&&region[i]!==region[v.y*W+v.x]){rehome(u);return;}
    if(Math.random()<mv)stepFlow(u,v);
  }else if(Math.random()<s.move*.5)wander(u);
}

/* ---------- ships ---------- */
function seaPath(si,ti){
  if(si===ti)return[si];
  if(tile[si]>WATER||tile[ti]>WATER||wreg[si]!==wreg[ti])return null;
  prevA.fill(-1);
  let h=0,t=0;bfsQ[t++]=si;prevA[si]=si;
  while(h<t){
    const i=bfsQ[h++];if(i===ti)break;
    const x=i%W,y=(i/W)|0;
    for(let n=0;n<8;n++){
      const nx=x+DIRS[n][0],ny=y+DIRS[n][1];if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const j=ny*W+nx;if(prevA[j]!==-1||tile[j]>WATER)continue;
      prevA[j]=i;bfsQ[t++]=j;
    }
  }
  if(prevA[ti]===-1)return null;
  const p=[];let c=ti;
  while(c!==si){p.push(c);c=prevA[c];}
  p.push(si);p.reverse();return p;
}
function launchBoat(k,path,cargo,mode,land){
  for(const u of cargo){u.stowed=true;u.foe=null;if(u.v){u.v.pop--;if(mode==='settle')u.v=null;}}
  sweepUnits();
  const i=path[0];
  boats.push({k,path,pi:0,x:i%W,y:(i/W)|0,cargo,mode,land,dir:1,dead:false});
}
function unloadBoat(b,lx,ly){
  b.dead=true;
  if(b.mode==='trade'){
    const k=b.k,o=b.to;
    if(k.alive&&lx>=0){k.gold+=b.cargoGold;if(o&&o.alive&&o!==k){o.gold+=b.cargoGold*.6;setRel(k,o,rel(k,o)+3);remember(o,k,0,.8,'trades with us');}}
    return;
  }
  for(const u of b.cargo){
    u.stowed=false;
    if(lx<0){u.dead=true;continue;}
    let x=lx,y=ly;
    const o=DIRS[(Math.random()*8)|0];
    if(walkable(lx+o[0],ly+o[1])){x=lx+o[0];y=ly+o[1];}
    u.x=x;u.y=y;units.push(u);
    if(b.mode==='settle'){u.v=null;u.settle={x:lx,y:ly,t:420,found:true,grp:null};}
    else{u.soldier=true;if(u.v&&u.v.alive)u.v.pop++;}
  }
  b.cargo=[];
}
function beach(b){
  for(let n=0;n<8;n++){const x=b.x+DIRS[n][0],y=b.y+DIRS[n][1];if(walkable(x,y)){unloadBoat(b,x,y);return;}}
  unloadBoat(b,-1,-1);
}
function updBoats(){
  let w=0;
  for(let n=0;n<boats.length;n++){
    const b=boats[n];
    b.px=b.x;b.py=b.y;
    if(!b.dead){
      b.pi++;
      if(b.pi>=b.path.length){
        if(walkable(b.land.x,b.land.y))unloadBoat(b,b.land.x,b.land.y);else beach(b);
      }else{
        const i=b.path[b.pi];
        if(tile[i]>WATER)beach(b);
        else{const nx=i%W;if(nx!==b.x)b.dir=nx>b.x?1:-1;b.x=nx;b.y=(i/W)|0;}
      }
    }
    if(!b.dead)boats[w++]=b;
  }
  boats.length=w;
}
function coastWater(i,wr){
  const x=i%W;
  if(x>0&&tile[i-1]<=WATER&&(wr<0?wsize[wreg[i-1]]>=120:wreg[i-1]===wr))return i-1;
  if(x<W-1&&tile[i+1]<=WATER&&(wr<0?wsize[wreg[i+1]]>=120:wreg[i+1]===wr))return i+1;
  if(i>=W&&tile[i-W]<=WATER&&(wr<0?wsize[wreg[i-W]]>=120:wreg[i-W]===wr))return i-W;
  if(i<N-W&&tile[i+W]<=WATER&&(wr<0?wsize[wreg[i+W]]>=120:wreg[i+W]===wr))return i+W;
  return -1;
}
function findLanding(tv,wr){
  let best=null,bd=65535;const f=flowOf(tv);
  for(let ly=FR-36;ly<=FR+36;ly++)for(let lx=FR-36;lx<=FR+36;lx++){
    const d=f[ly*FD+lx];if(d>=bd||d<3)continue;
    const x=lx+tv.x-FR,y=ly+tv.y-FR;if(x<1||y<1||x>=W-1||y>=H-1)continue;
    const wi=coastWater(y*W+x,wr);if(wi<0)continue;
    bd=d;best={x,y,wi};
  }
  return best;
}
function dispatchRaid(k){
  const port=k.port,land=k.landing;
  if(!port||!port.alive||port.k!==k||!port.dock||!land||tick<k.boatCd)return;
  const dk=port.dock,grp=[];
  for(const u of units){
    if(u.k===k&&u.soldier&&!u.dead&&(u.x-dk.x)*(u.x-dk.x)+(u.y-dk.y)*(u.y-dk.y)<=20){grp.push(u);if(grp.length>=14)break;}
  }
  if(grp.length<5)return;
  const path=seaPath(dk.wi,land.wi);
  if(!path){k.target=null;k.landing=null;return;}
  launchBoat(k,path,grp,'raid',land);
  k.boatCd=tick+25;
}

/* ================= villages and kingdoms ================= */
function rulerName(k){return k.ruler.title+' '+k.ruler.name;}
function newRuler(race,keep,parentTm,cult,nat){
  const p=pick(RULERS[race]);
  const trait=keep&&Math.random()<.3?keep:pickTrait(nat===undefined?1:nat);
  return{name:p[0],title:p[1],trait,tm:rollTemper(trait,race,parentTm||null,cult||null),since:tick,until:tick+((16+Math.random()*30)*YEAR|0)};
}
function newKingdom(race,name){
  const color=COLORS[kc++%COLORS.length];
  const k={id:kingdoms.length+1,name:name||genName(race),race,color,rgb:hexRgb(color),villages:[],alive:true,
    gold:10,lore:0,age:0,tech:0,pow:1,pop:0,str:0,focus:'grow',focusUntil:0,restUntil:tick+(tick<30*YEAR?28:8)*YEAR,
    ruler:null,wars:new Set(),allies:new Set(),nb:[],regs:new Set(),
    target:null,port:null,landing:null,rally:null,rallyUntil:0,pauseUntil:0,boatCd:0,nAdult:0,nSold:0,nBarr:0,nCar:0,nSiege:0,broke:false,born:tick,
    launches:0,colony:false,peak:0,hist:[],
    mem:{},rep:50,goal:null,weary:0,pacts:[],kin:[],nudge:null,mind:null,cool:{},nat:null,culture:null};
  natOf(k);cultureOf(k);
  k.ruler=newRuler(race,null,null,k.culture,k.nat);
  kingdoms.push(k);
  if(!name)chron(rulerName(k)+' founds the '+SPEC[race].name.toLowerCase()+' realm of '+k.name,'found',k.villages[0]);
  return k;
}
function kPop(k){let n=0;for(const v of k.villages)n+=v.pop;return n;}
/* every figure on the map stands for a crowd that grows with the age */
function citizens(v){return v.pop*PPL[v.k.age];}
function kCitizens(k){let n=0;for(const v of k.villages)n+=v.pop;return n*PPL[k.age];}
function fmtPop(n){return n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e4?Math.round(n/1e3)+'k':n>=1e3?(n/1e3).toFixed(1)+'k':String(n|0);}
function settlementWord(v){const h=v.houses,a=v.k.age;return h>=30&&a>=6?'Metropolis':h>=20?'City':h>=12?'Town':h>=5?'Village':'Hamlet';}
function updPow(k){k.pow=(1+.15*k.age)*(k.nBarr>0?1.2:1)*(k.ruler.trait.id==='conqueror'?1.1:1)*(k.broke?.85:1);}
function hallHp(v){return BHP.hall*(1+.3*v.k.age)*(v.race===DWARF?1.25:1);}
function claim(v,x,y,r){
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(dx*dx+dy*dy>r*r+r)continue;
    const nx=x+dx,ny=y+dy;if(!inB(nx,ny))continue;
    const i=ny*W+nx;if(!vown[i]&&tile[i]!==DEEP)vown[i]=v.id;
  }
  touchRows(y-r-1,y+r+1);
}
function countTrees(v){
  let n=0;
  for(let dy=-7;dy<=7;dy++)for(let dx=-7;dx<=7;dx++){const x=v.x+dx,y=v.y+dy;if(inB(x,y)&&TREE[tile[y*W+x]])n++;}
  return n*.22;
}
function recalc(v){
  v.houses=v.farms=v.towers=v.mines=v.factories=v.walls=0;
  v.market=v.barracks=v.temple=v.academy=v.dock=v.windmill=v.lighthouse=v.arena=v.wonder=v.pad=null;
  let food=4;
  for(const b of v.blds){
    switch(b.kind){
      case'house':v.houses++;break;
      case'farm':v.farms++;food+=3*b.fert;break;
      case'tower':v.towers++;break;
      case'mine':v.mines++;break;
      case'dock':v.dock=b;food+=9;break;
      case'market':v.market=b;break;
      case'barracks':v.barracks=b;break;
      case'temple':v.temple=b;break;
      case'academy':v.academy=b;break;
      case'windmill':v.windmill=b;food+=6;break;
      case'lighthouse':v.lighthouse=b;break;
      case'factory':v.factories++;break;
      case'arena':v.arena=b;break;
      case'wonder':v.wonder=b;break;
      case'launchpad':v.pad=b;break;
      case'wall':v.walls++;break;
    }
  }
  if(v.race===ELF)food+=v.treeFood;
  v.food=food;
}
function addBuilding(v,kind,x,y,ex){
  const i=y*W+x,big=BIG[kind]?2:1;
  const b={kind,x,y,i,v,hp:BHP[kind]||50,solid:kind!=='farm'&&kind!=='dock'&&kind!=='mine',fert:1,wi:-1,grove:false,cd:0,big,prog:0};
  if(kind==='hall')b.hp=hallHp(v);
  if(ex)Object.assign(b,ex);
  b.tiles=[];
  for(let dy=0;dy<big;dy++)for(let dx=0;dx<big;dx++){
    const j=(y+dy)*W+x+dx,t=tile[j];
    b.tiles.push(j);bmap[j]=b;
    if(kind==='farm'){
      if(b.grove)b.fert=.8;
      else{b.fert=Math.max(.3,FERT[TREE[t]?soil[j]:t])*(v.race===ORC?.75:1);if(TREE[t]||t===ASH)setTile(j,soil[j]);}
    }else if((TREE[t]&&v.race!==ELF)||t===ASH)setTile(j,soil[j]);
    if(road[j])road[j]=0;
    touch(j);
  }
  v.blds.push(b);
  if(b.prog<1)raising.push(b);
  if(kind==='tower')towers.push(b);
  claim(v,x,y,kind==='hall'?6:kind==='farm'?3:kind==='wall'?2:4);
  recalc(v);

/* ---------- the space age: rockets, then a colony ship ---------- */

/* ---------- the modern age: bombers fly against the enemy ---------- */
function airRaid(k){
  const c=k.villages[0],t=k.target;if(!c)return;
  k.gold-=40;
  planes.push({k,x:c.x,y:c.y,tx:t.x,ty:t.y,hx:c.x,hy:c.y,state:0,bombs:4,dir:t.x>=c.x?1:-1,px:c.x,py:c.y});
}
function updPlanes(){
  let w=0;
  for(let n=0;n<planes.length;n++){
    const p=planes[n];p.px=p.x;p.py=p.y;
    const tx=p.state?p.hx:p.tx,ty=p.state?p.hy:p.ty,dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);
    if(d<1.2){
      if(!p.state){
        for(let m=0;m<p.bombs;m++)sched.push({t:tick+m*2+1,f:'bomb',x:Math.round(p.x+(Math.random()-.5)*5),y:Math.round(p.y+(Math.random()-.5)*5),k:p.k});
        p.state=1;p.dir=-p.dir;

    }else{p.x+=dx/d*.8;p.y+=dy/d*.8;if(Math.abs(dx)>.3)p.dir=dx>0?1:-1;}

/* ---------- merchant fleets between friendly harbours ---------- */
function tradeFleet(k){
  let port=null;for(const v of k.villages)if(v.dock&&v.market){port=v;break;}
  if(!port)return;
  const wr=wreg[port.dock.wi];
  const cands=[];
  for(const n of k.nb){const o=n.k;if(!o.alive||k.wars.has(o)||(!k.allies.has(o)&&!hasPact(k,o)&&rel(k,o)<5))continue;for(const v of o.villages)if(v.dock&&wreg[v.dock.wi]===wr)cands.push(v);}
  for(const v of k.villages)if(v!==port&&v.dock&&wreg[v.dock.wi]===wr&&d2(v,port)>400)cands.push(v);
  if(!cands.length)return;
  const dest=pick(cands);
  const path=seaPath(port.dock.wi,dest.dock.wi);if(!path||path.length<12)return;
  launchBoat(k,path,[],'trade',{x:dest.dock.x,y:dest.dock.y});
  const b=boats[boats.length-1];b.to=dest.k;b.cargoGold=(8+path.length*.06)*(1+(TIER[k.age]||0)*.4)*(dest.k!==k?1.4:1);
}
/* ---------- a yearly record for the history chart ---------- */
function recordHistory(){
  const yr=yearNow();
  for(const k of kingdoms){
    if(!k.alive&&!k.hist.length)continue;
    const c=k.alive?kCitizens(k):0;
    if(c>k.peak)k.peak=c;
    if(k.alive||k.hist.length&&k.hist[k.hist.length-1][1]>0)k.hist.push([yr,c]);
    if(k.hist.length>1200)k.hist.splice(0,k.hist.length-1200);
  }
  let tot=0,best=0;for(const k of kingdoms)if(k.alive){tot+=kCitizens(k);if(k.age>best)best=k.age;}
  history.push([yr,tot,best]);if(history.length>3000)history.shift();
}


/* ===== 45-mind.js ===== */
/* ================= the minds of rulers =================
   Every ruler has a temperament, a memory of what other realms did, and a long-term goal.
   Once a year they weigh their real options, each scored from named factors, and act on the
   strongest if it is strong enough. Other rulers answer offers with the same kind of reasoning.
   The realm page shows all of it, so you can watch them think. */
const TEMPER=['aggr','caut','ambi','greed','zeal','honor','curio','cunning'];
const TEMPER_NAME={aggr:'Aggression',caut:'Caution',ambi:'Ambition',greed:'Greed',zeal:'Zeal',honor:'Honour',curio:'Curiosity',cunning:'Cunning'};
const TRAIT_TM={
  conqueror:{aggr:.85,caut:.25,ambi:.8,greed:.4,zeal:.4,honor:.5,curio:.2,cunning:.4},
  builder:{aggr:.3,caut:.55,ambi:.85,greed:.4,zeal:.3,honor:.6,curio:.45,cunning:.25},
  merchant:{aggr:.2,caut:.6,ambi:.5,greed:.9,zeal:.15,honor:.55,curio:.4,cunning:.5},
  scholar:{aggr:.15,caut:.7,ambi:.45,greed:.3,zeal:.2,honor:.65,curio:.92,cunning:.3},
  zealot:{aggr:.6,caut:.4,ambi:.5,greed:.3,zeal:.95,honor:.55,curio:.25,cunning:.3},
  schemer:{aggr:.5,caut:.45,ambi:.65,greed:.6,zeal:.3,honor:.12,curio:.35,cunning:.95}};
const RACE_TM=[{ambi:.1},{curio:.15,zeal:.1,aggr:-.1},{greed:.15,honor:.15},{aggr:.2,caut:-.1,curio:-.1}];
const ARMY_WORD=['warriors','spearmen','legions','legions','knights','musketeers','riflemen','divisions','divisions'];
const clamp01=v=>v<0?0:v>1?1:v;
/* ---------- the character of a people and of each nation ----------
   When a world is made, each people is set to be peaceful, average or warlike. Every realm then gets
   its own national character around that, which outlives its rulers: each new ruler is born near it. */
const NATURES=['peaceful','average','warlike'];
let NATURE=[1,1,1,1];
const NAT_SHIFT=[{aggr:-.26,caut:.12,honor:.12,zeal:-.1,curio:.08,greed:.04},{},{aggr:.26,caut:-.12,ambi:.1,zeal:.1,honor:-.06,curio:-.06}];
const NAT_TRAITW=[{conqueror:.25,zealot:.6,schemer:.6,builder:1.3,merchant:1.3,scholar:1.4},{},{conqueror:2.2,zealot:1.4,schemer:1.2,builder:.8,merchant:.6,scholar:.5}];
function natureFromSettings(){NATURE=[S.natHuman,S.natElf,S.natDwarf,S.natOrc].map(v=>Math.max(0,NATURES.indexOf(v)));}
function rollCulture(race,nat){
  const c={},sh=NAT_SHIFT[nat]||{};
  for(const a of TEMPER)c[a]=Math.max(.05,Math.min(.95,.5+(RACE_TM[race][a]||0)+(sh[a]||0)+(Math.random()-.5)*.3));
  return c;
}
function natOf(k){if(k.nat===undefined||k.nat===null)k.nat=NATURE[k.race]===undefined?1:NATURE[k.race];return k.nat;}
function cultureOf(k){return k.culture||(k.culture=rollCulture(k.race,natOf(k)));}
/* a breakaway realm keeps most of its parent's character */
function driftCulture(c){const d={};for(const a of TEMPER)d[a]=Math.max(.05,Math.min(.95,c[a]+(Math.random()-.5)*.2));return d;}
function pickTrait(nat){
  const w=NAT_TRAITW[nat]||{};let t=0;for(const x of TRAITS)t+=w[x.id]||1;
  let r=Math.random()*t;for(const x of TRAITS){r-=w[x.id]||1;if(r<=0)return x;}
  return TRAITS[0];
}
function rollTemper(trait,race,parent,cult){
  const t={};
  for(const a of TEMPER){
    let b=cult?TRAIT_TM[trait.id][a]*.45+cult[a]*.55:TRAIT_TM[trait.id][a]+(RACE_TM[race][a]||0);
    if(parent&&parent[a]!==undefined)b=b*.7+parent[a]*.3;
    t[a]=Math.max(.03,Math.min(.97,b+(Math.random()-.5)*(cult?.26:.32)));
  }
  return t;
}
function tmOf(k){const r=k.ruler;return r.tm||(r.tm=rollTemper(r.trait,k.race,null,cultureOf(k)));}

/* ---------- memory: grudges and debts between realms ---------- */
function memOf(k,o){const m=k.mem||(k.mem={});return m[o.id]||(m[o.id]={g:0,d:0,why:'',dwhy:''});}
function remember(k,o,dg,dd,why){
  if(!k||!o||k===o||!k.alive)return;
  const m=memOf(k,o);
  m.g=Math.max(0,Math.min(150,m.g+dg));m.d=Math.max(0,Math.min(100,m.d+dd));
  if(why&&dg>=8){m.why=why;m.wy=yearNow();}
  if(why&&dd>0&&(dd>=8||!m.dwhy)){m.dwhy=why;m.dy=yearNow();}
}
function grudge(k,o){const m=k.mem&&k.mem[o.id];return m?m.g:0;}
function debt(k,o){const m=k.mem&&k.mem[o.id];return m?m.d:0;}
/* after an offer or a demand, a ruler waits years before trying the same again */
function cool(k,kind,o){return!!(k.cool&&k.cool[kind+o.id]>tick);}
function setCool(k,kind,o,yrs){(k.cool||(k.cool={}))[kind+o.id]=tick+yrs*YEAR|0;}
function hasPact(k,o){return!!(k.pacts&&k.pacts.indexOf(o.id)>=0);}
function repOf(k){return k.rep===undefined?(k.rep=50):k.rep;}
function fadeMemory(k){
  if(!k.mem)return;
  for(const id in k.mem){const m=k.mem[id];m.g*=m.why&&m.why.indexOf('betray')>=0?.985:.965;m.d*=.95;if(m.g<1&&m.d<1)delete k.mem[id];}

/* ---------- how a ruler sees the world ---------- */
function allyStr(o){let s=o.str;for(const a of o.allies)if(a.alive)s+=a.str*.6;return s;}
function canReach(k,o){return sameLand(k,o)?1:(k.age>=1&&hasDock(k))?.5:0;}
function nbDist(k,o){for(const n of k.nb)if(n.k===o)return n.d;return 999;}
/* how strongly another realm frightens us */
function fearOf(k,o){
  if(!o.alive||k.allies.has(o))return 0;
  const ratio=allyStr(o)/(allyStr(k)+1),d=nbDist(k,o),near=d<40?1:d<90?.6:.25;
  return clamp01((ratio-1)*.5*near*(.5+tmOf(o).aggr)+(rel(k,o)<-30?.15:0));

/* what we would gain from taking another realm's land */
function covet(k,o){
  let c=0;const tm=tmOf(k);
  for(const v of o.villages){
    if(v.wonder&&v.wonder.prog>=1)c+=.35;
    const ours=nearestVillageOf(k,v.x,v.y);if(ours&&d2(ours,v)<45*45)c+=.12;

}
function armyWord(k){return ARMY_WORD[k.age]||'warriors';}
function say(k,list,o,extra){

  let s=list[(Math.random()*list.length)|0];
  s=s.replace(/\{O\}/g,o?o.name:'').replace(/\{OP\}/g,o?SPEC[o.race].pl.toLowerCase():'').replace(/\{ARMY\}/g,armyWord(k)).replace(/\{X\}/g,extra||'');

}
const SAY={
  war_weak:['{O} is weak. We take what we want.','Their walls are thin. March on {O}!','Our {ARMY} will feast in {O}.'],
  war_grudge:['{O} will pay for what they did.','We have not forgotten, {O}.','Vengeance for {X}!'],

  war_betray:['Alliances are for the weak. {O} is ours.'],
  peace_weary:['Enough blood. Let there be peace with {O}.','Our people are tired of war.'],
  peace_losing:['We cannot win this. Seek terms with {O}.'],
  peace_broke:['The treasury is empty. We need peace.'],
  ally:['Together we stand against {X}.','{O} is a true friend.','Two realms, one shield.'],
  ally_kin:['The {OP} stand together.'],
  tribute:['Pay, {O}, or face our {ARMY}.','A tithe, {O}. Or war.'],

  tribute_refused:['We bow to no one.','Come and take it.'],
  gift:['A gift for our friends in {O}.','Let {O} know our goodwill.'],
  pact:['Let our caravans roll to {O}.','Trade makes us both rich.'],

  patron:['Knowledge is our greatest treasure.','Build schools, not swords.'],
  refuse_war:['The heavens ask too much. We will not fight.','War? Not while I live.'],

  accept:['The heavens have spoken. We obey.','As the gods will it.']};

/* ---------- long-term goals ---------- */
const GOALS={conquer:'Conquer',avenge:'Avenge wrongs by',defend:'Defend against',prosper:'Grow rich',enlighten:'Seek knowledge',expand:'Settle new lands'};
const GOAL_FOCUS={conquer:'army',avenge:'army',defend:'army',prosper:'wealth',enlighten:'lore',expand:'grow'};
const lc1=t=>t.charAt(0).toLowerCase()+t.slice(1);
function goalText(g){
  if(!g)return'Keeping the realm steady';
  return GOALS[g.type]+(g.o?' '+g.o.name:'')+(g.why?' ('+g.why+')':'');
}
function chooseGoal(k){
  const tm=tmOf(k),opts=[],maxV=5+k.age+(k.ruler.trait.id==='builder'?2:0);
  opts.push({type:'prosper',s:.15+tm.greed*.55,why:'a merchant’s heart'});
  opts.push({type:'enlighten',s:.1+tm.curio*.6+(wonderFor(k)?.08:0),why:'a curious mind'});
  if(k.villages.length<maxV)opts.push({type:'expand',s:.12+tm.ambi*.5,why:'room to grow'});
  for(const n of k.nb){
    const o=n.k;if(!o.alive||!canReach(k,o))continue;
    const adv=allyStr(k)/(allyStr(o)+1),g=grudge(k,o),f=fearOf(k,o);
    if(adv>1.3&&!k.allies.has(o))opts.push({type:'conquer',o,s:tm.ambi*.3+tm.aggr*.3+covet(k,o)*.25+Math.min(.25,(adv-1)*.2)-tm.caut*.25+(natOf(k)-1)*.08,why:adv>2?'they are weak':covet(k,o)>.3?'their riches':'room to grow'});
    if(g>25)opts.push({type:'avenge',o,s:g/100*(.7+tm.aggr*.4)-tm.honor*.05,why:memOf(k,o).why||'old wrongs'});
    if(f>.25)opts.push({type:'defend',o,s:f*(.6+tm.caut*.6),why:'they grow too strong'});
  }
  opts.sort((a,b)=>b.s-a.s);
  const best=opts[0],cur=k.goal;

  if(cur){
    const still=opts.find(p=>p.type===cur.type&&p.o===cur.o);
    if(still&&still.s>=best.s*.8&&tick-cur.since<40*YEAR){cur.s=still.s;return;}
  }
  k.goal={type:best.type,o:best.o||null,why:best.why,s:best.s,since:tick};
  if(cur&&(cur.type!==best.type||cur.o!==best.o)&&!quiet&&(best.type==='conquer'||best.type==='avenge'||best.type==='defend'))
    chron(rulerName(k)+' of '+k.name+' turns the realm toward a new aim: '+lc1(goalText(k.goal)),'ruler',k,true);

/* ---------- the yearly council: weigh every option, act on the best ---------- */
function sumWhy(f){let s=0;for(const x of f)s+=x[1];return s;}
function weighWar(k,o){
  const tm=tmOf(k),f=[],mood=MOOD[S.mood]||1,reach=canReach(k,o);
  if(!reach)return null;
  const adv=allyStr(k)/(allyStr(o)+1),g=grudge(k,o),goal=k.goal&&k.goal.o===o&&(k.goal.type==='conquer'||k.goal.type==='avenge');
  {const t=(tm.aggr-.45)*.5;f.push([t>0?'a warlike temper':'a peaceable temper',t]);}
  if(mood<1)f.push(['peaceful times',-.3]);else if(mood>1)f.push(['a bloodthirsty age',.3]);
  {const nt=natOf(k);if(nt!==1)f.push([nt?'a warlike people':'a peaceful people',nt?.18:-.18]);}
  if(adv>1)f.push(['they are weaker',Math.min(.45,(adv-1)*.3)*(1-tm.caut*.5)]);else f.push(['they are stronger',-(1/Math.max(.2,adv)-1)*.35*(.5+tm.caut)]);
  if(g>5)f.push(['old grudge',g/100*.55]);
  const cv=covet(k,o);if(cv>.05)f.push(['covets their land',cv*tm.ambi*.55]);
  if(o.race!==k.race&&tm.zeal>.5)f.push(['zeal against the '+SPEC[o.race].pl.toLowerCase(),(tm.zeal-.5)*.5]);
  if(o.wars.size)f.push(['they are busy at war',tm.cunning*.3]);
  if(goal)f.push(['it is our goal',.4]);
  if(k.nudge&&tick<k.nudge.until)f.push(k.nudge.type==='war'?['the heavens urge war',.45]:['the heavens urge peace',-.45]);
  if(k.wars.size)f.push(['already at war',-.35*k.wars.size]);
  if(k.weary)f.push(['war weariness',-k.weary*.7]);
  if(inTruce(k,o))f.push(['we swore a truce',-(.3+tm.honor*.9)]);
  if(k.allies.has(o))f.push(['they are our ally',-(.4+tm.honor*1.1)+tm.cunning*.3]);
  if(k.kin&&k.kin.indexOf(o.id)>=0)f.push(['royal kin',-.35*tm.honor]);
  if(hasPact(k,o))f.push(['trade pact',-.1-.25*tm.greed]);
  if(debt(k,o)>5)f.push(['we owe them',-debt(k,o)/100*.5]);
  const d=nbDist(k,o);if(d>80)f.push(['far away',-.15]);
  if(reach<1)f.push(['across the sea',-.12]);
  if(tick-o.born<20*YEAR&&mood<2)f.push(['they are newly founded',-.6]);
  if(tick<k.restUntil)f.push([tick-k.born<30*YEAR?'the realm is young':'still recovering',-.7]);

}
function weighPeace(k,o){

  const yrs=(tick-w.start)/YEAR,diff=(w.a===k?w.sa-w.sb:w.sb-w.sa);
  if(yrs<1.5)return{kind:'peace',o,u:-1,f:[['the war has just begun',-1]]};
  if(cool(k,'peace',o))return{kind:'peace',o,u:-.5,f:[['they refused our last offer',-.5]]};
  f.push(['war weariness',(k.weary||0)*.8+yrs*.012]);
  if(diff<-10)f.push(['we are losing',Math.min(.5,-diff/80)*(.5+tm.caut)]);
  if(diff>10)f.push(['we are winning',-Math.min(.5,diff/80)*(.4+tm.aggr)]);
  if(k.broke)f.push(['empty treasury',.3]);
  const g=grudge(k,o);if(g>10)f.push(['old grudge',-g/100*.5]);
  if(k.goal&&k.goal.o===o&&k.goal.type!=='defend')f.push(['it is our goal to beat them',-.35]);
  if(k.nudge&&tick<k.nudge.until)f.push(k.nudge.type==='peace'?['the heavens urge peace',.5]:['the heavens urge war',-.4]);
  {const t=(tm.caut-tm.aggr)*.25;f.push([t>0?'a careful temper':'a warlike temper',t]);}

function weighAlliance(k,o){

  const tm=tmOf(k),f=[];

  if(shared)f.push(['common enemy '+shared.name,.5]);
  let threat=null,tf=0;for(const n of k.nb){const t=n.k;if(t===o||!t.alive)continue;const fk=fearOf(k,t),fo=fearOf(o,t);if(fk+fo>tf){tf=fk+fo;threat=t;}}
  if(threat&&tf>.3)f.push(['fear of '+threat.name,tf*.4*(.5+tm.caut)]);
  f.push([rel(k,o)>=0?'friendship':'ill feeling',rel(k,o)/100*.5]);
  if(o.race===k.race)f.push(['the same people',.12]);else if(tm.zeal>.5)f.push(['distrust of the '+SPEC[o.race].pl.toLowerCase(),-(tm.zeal-.5)*.5]);
  if(repOf(o)<35)f.push(['they break promises',-(35-repOf(o))/100]);
  if(grudge(k,o)>10)f.push(['old grudge',-grudge(k,o)/100*.6]);
  if(k.goal&&k.goal.type==='defend'&&k.goal.o&&o.wars.has(k.goal.o))f.push(['they fight our foe',.25]);
  {const t=(tm.caut-.5)*.2;f.push([t>0?'caution':'self-reliance',t]);}

}
function weighTribute(k,o){
  if(k.allies.has(o)||k.wars.has(o)||inTruce(k,o)||!canReach(k,o)||o.gold<40||cool(k,'trib',o))return null;
  const tm=tmOf(k),adv=allyStr(k)/(allyStr(o)+1);if(adv<1.6)return null;

  if(k.goal&&k.goal.type==='prosper')f.push(['it fills the treasury',.12]);
  if(natOf(k)!==1)f.push([natOf(k)?'a warlike people':'a peaceful people',natOf(k)?.08:-.12]);

}
function weighGift(k,o){

  const tm=tmOf(k),fr=fearOf(k,o);if(fr<.25&&rel(k,o)>-10)return null;

}
function weighPact(k,o){
  if(k.wars.has(o)||hasPact(k,o)||k.age<1||rel(k,o)<0||cool(k,'pact',o))return null;
  const tm=tmOf(k),f=[['greed',tm.greed*.4],['friendship',rel(k,o)/100*.3]];

function weighMarriage(k,o){

const WAR_WHY={'a warlike temper':'for glory','a warlike people':'as warlike peoples do','they are weaker':'seeing their weakness','old grudge':'to avenge old wrongs','covets their land':'coveting their land','they are busy at war':'while they are busy elsewhere',

/* what the loser gives up when a war ends */
function peaceTerms(a,b,w){
  if(!w)return'';
  const diff=w.sa-w.sb,win=diff>0?w.a:w.b,lose=win===w.a?w.b:w.a,m=Math.abs(diff);
  if(m<15)return'Neither side gains anything';
  if(m>=45&&lose.villages.length>=2){
    let best=null,bd=1e9;
    for(const v of lose.villages){if(v===lose.villages[0])continue;const c=nearestVillageOf(win,v.x,v.y);if(c){const d=d2(c,v);if(d<bd){bd=d;best=v;}}}
    if(best&&bd<80*80){cedeVillage(best,win);remember(lose,win,30,0,'took '+best.name+' in the peace');return lose.name+' cedes '+best.name+' to '+win.name;}
  }
  const pay=Math.round(lose.gold*(m>30?.4:.2));lose.gold-=pay;win.gold+=pay;
  remember(lose,win,8,0,'forced reparations on us');
  return lose.name+' pays '+pay+' gold in reparations';
}
/* a town changes hands by treaty, keeping its people */
function cedeVillage(v,k){
  const old=v.k;if(old===k)return;
  const n=old.villages.indexOf(v);if(n>=0)old.villages.splice(n,1);
  const same=v.race===k.race;v.k=k;v.race=k.race;k.villages.push(v);
  for(const u of units)if(u.v===v&&!u.dead){if(same){u.k=k;u.soldier=false;}else{u.v=null;u.k=null;u.soldier=false;}}
  dirtyAll=true;
}
/* allies decide for themselves whether to answer the call */
function answerCall(al,friend,foe,offense){
  const tm=tmOf(al),f=tm.honor*.6+debt(al,friend)/100*.5+rel(al,friend)/100*.3+grudge(al,foe)/100*.5-tm.caut*fearOf(al,foe)*.4-(al.weary||0)*.4-al.wars.size*.2+(tm.aggr-.5)*.2
    -(inTruce(al,foe)?.2+tm.honor*.3:0)-(hasPact(al,foe)?.15:0)+(natOf(al)-1)*.08+(Math.random()-.5)*.15;

/* the heavens whisper to a ruler; whether they listen depends on who they are */
function whisper(k,kind){

function ignite(i){
  if(fire[i])return;
  const d=bmap[i]?30:BURN[tile[i]];
  if(!d)return;
  fire[i]=d;fireList.push(i);touch(i);
}
function fireStep(){
  let w=0;
  for(let n=0;n<fireList.length;n++){
    const i=fireList[n];if(!fire[i])continue;
    const t=tile[i],b=bmap[i];
    if(Math.random()<(b?.1:SPREAD[t])){const j=nbr(i);if(j>=0)ignite(j);}
    if(b)damageBld(b,3,null);
    if(!fire[i])continue;
    if(--fire[i]===0){
      touch(i);
      if(TREE[t])setTile(i,ASH);
      else if(BURN[t]&&!bmap[i]&&Math.random()<.5)setTile(i,ASH);
    }else fireList[w++]=i;
  }
  fireList.length=w;
}
function tileTicks(){
  const cnt=Math.round(N/85);
  for(let n=0;n<cnt;n++){
    const i=(Math.random()*N)|0,t=tile[i];
    if(t===ASH){if(Math.random()<.2)setTile(i,soil[i]===HILL?HILL:soil[i]);}

      if(!vown[i]&&!bmap[i]&&!road[i]&&Math.random()<.03){
        const j=nbr(i);

          const tj=tile[j];
          if(t===GRASS&&(tj===FOREST||tj===JUNGLE||tj===PINE))setTile(i,tj);
          else if(t===TUNDRA&&tj===PINE)setTile(i,PINE);
        }
      }
    }
  }

function updTowers(){
  for(let n=0;n<towers.length;n++){
    const b=towers[n];
    if((tick+n)%5)continue;
    const k=b.v.k;
    if(!k.wars.size&&!counts[ZOMBIE])continue;
    const f=nearest(b,6,o=>o.t===ZOMBIE||(o.k!==null&&o.k!==k&&k.wars.has(o.k)));
    if(f){hit(f,6*k.pow,null);fx({k:'arrow',x:b.x,y:b.y-1,x2:f.x,y2:f.y,t:5,T:5});}
  }
}
function runSched(){
  let w=0;
  for(let n=0;n<sched.length;n++){
    const e=sched[n];
    if(e.t>tick){sched[w++]=e;continue;}
    if(e.f==='bolt')strike(e.x,e.y);
    else if(e.f==='shell'||e.f==='bomb'){
      if(inB(e.x,e.y)){
        const i=e.y*W+e.x,b=bmap[i],bomb=e.f==='bomb';
        if(b&&b.v.k!==e.k){
          const d=bomb?55:e.d;
          if(bomb&&b.kind==='hall')b.hp=Math.max(b.hp-d,hallHp(b.v)*.25);else damageBld(b,d,b.kind==='hall'?{k:e.k}:null);
        }
        if(bomb&&Math.random()<.4)ignite(i);
        const rr=bomb?2.3:1.6;
        for(const u of units)if(!u.dead&&u.k!==e.k&&(u.x-e.x)*(u.x-e.x)+(u.y-e.y)*(u.y-e.y)<=rr)hit(u,bomb?30:14,null);
        fx({k:'boom',x:e.x,y:e.y,r:bomb?1.6:1.1,t:12,T:12});
        if(bomb&&!reduceMotion)shake=Math.max(shake,3);
      }
    }
    else if(e.f==='lavabomb'){
      if(inB(e.x,e.y)){
        const i=e.y*W+e.x;
        if(tile[i]>WATER){setTile(i,LAVA,true);ignite(i);fx({k:'boom',x:e.x,y:e.y,r:1.5,t:10,T:10});}
      }
    }
  }
  sched.length=w;
}

/* ---------- one tick of the simulation ---------- */
function step(){
  tick++;
  for(let n=0;n<grid.length;n++)grid[n].length=0;
  counts.fill(0);
  for(let n=0;n<units.length;n++){const u=units[n];grid[(u.y>>3)*GW+(u.x>>3)].push(u);counts[u.t]++;}
  for(let n=0,len=units.length;n<len;n++){const u=units[n];if(!u.dead)updUnit(u);}
  if(risen.length){for(let n=0;n<risen.length;n+=2)spawn(ZOMBIE,risen[n],risen[n+1]);risen.length=0;}
  sweepUnits();
  if(boats.length)updBoats();
  if(planes.length)updPlanes();
  if(twisters.length)updTwisters();
  if(towers.length)updTowers();
  fireStep();tileTicks();
  if(SL!==seaGoal&&tick%5===0)seaStep();
  stormsStep();
  if(sched.length)runSched();
  if(tick%10===0)villagesStep();
  if(tick%YEAR===0)rulersStep();
}

/* ===== 55-terra.js ===== */
/* ================= terraforming, climate and weather ================= */
/* height bands above the sea: lowland, hills, mountains, peaks */
function bandOf(e){const r=e-SL;return r<0?-1:r<58?0:r<88?1:r<118?2:3;}
function tBase(i){return temp[i]/255*1.5-.25;}
function tEff(i){return tBase(i)-Math.max(0,elev[i]-SL)/155*.3;}
/* the natural ground for a lowland tile, from its warmth, wetness and height */
function biomeFor(i){
  const T=tEff(i),M=moist[i]/255,low=elev[i]-SL;
  if(low<3&&T>.2&&coastWater(i,-1)>=0)return SAND;
  if(T<.2)return M>.55?PINE:TUNDRA;
  if(T<.36)return M>.5?PINE:GRASS;
  if(T<.68){if(M>.76&&low<20)return SWAMP;return M>.52?FOREST:GRASS;}
  return M<.34?DESERT:M<.54?SAVANNA:JUNGLE;
}
function soilFor(t){return t===FOREST||t===JUNGLE?GRASS:t===PINE?GRASS:t===HILL||t===MOUNT||t===SNOW?HILL:t<=WATER?SAND:t;}
/* settle a tile's type after its height or climate changed */
function reclass(i,climateOnly){
  const t=tile[i],e=elev[i],b=bandOf(e);
  let n=t;
  if(b<0){if(t>WATER||climateOnly)n=e<SL-30?DEEP:WATER;}
  else if(b===0){
    if(t<=WATER||t===HILL||t===MOUNT||t===SNOW||climateOnly)n=biomeFor(i);
    if(t===RIVER&&!climateOnly)n=RIVER;
    if(t===LAVA||t===ASH)n=t;
  }else if(b===1)n=t===LAVA?t:HILL;
  else if(b===2)n=t===LAVA?t:tEff(i)<.12?SNOW:MOUNT;
  else n=SNOW;
  if(n!==t){const s=soilFor(n);setTile(i,n);soil[i]=s;}
  touch(i);
}
function terraBrush(tx,ty,fn){
  const r=brush+.5,R=Math.ceil(r);
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
    const d=Math.sqrt(dx*dx+dy*dy);if(d>r)continue;
    const x=tx+dx,y=ty+dy;if(!inB(x,y))continue;
    fn(y*W+x,1-d/(r+.5),x,y);
  }
}
function raiseLand(tx,ty,dir){
  terraBrush(tx,ty,(i,f)=>{
    const t=tile[i];
    let step=dir*Math.max(1,Math.round(6*f*sculptStr/5));
    if(dir>0&&t<=WATER&&elev[i]+step<SL&&f>.5)step=Math.max(step,SL-elev[i]);
    elev[i]=Math.max(4,Math.min(255,elev[i]+step));
    reclass(i,false);
  });

}
function flattenLand(tx,ty){
  if(!inB(tx,ty))return;
  const goal=elev[ty*W+tx];
  terraBrush(tx,ty,(i,f)=>{elev[i]=Math.round(elev[i]+(goal-elev[i])*.35*f);reclass(i,false);});
}
function climateBrush(tx,ty,dT,dM){
  terraBrush(tx,ty,(i,f)=>{
    if(dT)temp[i]=Math.max(0,Math.min(255,temp[i]+Math.round(dT*f)));
    if(dM)moist[i]=Math.max(0,Math.min(255,moist[i]+Math.round(dM*f)));
    const t=tile[i];
    if(t===LAVA||t===ASH||t===RIVER||t<=WATER){touch(i);return;}
    if(bandOf(elev[i])===0){
      const n=biomeFor(i);
      /* trees only take root where nobody has built */
      if(n!==t&&!(TREE[n]&&(bmap[i]||road[i]))){setTile(i,n);soil[i]=soilFor(n);}
    }else reclass(i,false);
    touch(i);
  });
}
function plantTrees(tx,ty){
  terraBrush(tx,ty,(i,f)=>{
    const t=tile[i];
    if(bmap[i]||road[i]||fire[i]||Math.random()>.55*f+.15)return;
    if(t!==GRASS&&t!==SAVANNA&&t!==TUNDRA&&t!==ASH&&t!==SAND&&t!==SWAMP&&t!==DESERT)return;
    const T=tEff(i),M=moist[i]/255;

/* a spring: water finds its way downhill to the sea, or pools into a lake */
function makeRiver(tx,ty){
  if(!inB(tx,ty))return false;
  let i=ty*W+tx;
  if(tile[i]<=WATER){toast('Tap dry land to start a river.');return false;}
  const seen=new Set();
  for(let st=0;st<900;st++){
    seen.add(i);
    const t=tile[i];
    if(t<=WATER)return true;
    if(st>0&&t===RIVER&&!seen.has(i))return true;
    if(t!==LAVA){if(bmap[i]&&bmap[i].solid)destroyBld(bmap[i]);setTile(i,RIVER);soil[i]=GRASS;}
    const x=i%W,y=(i/W)|0;let best=-1,bh=1e9;
    for(let k=0;k<8;k+=2){
      const nx=x+DIRS[k][0],ny=y+DIRS[k][1];if(!inB(nx,ny))continue;
      const j=ny*W+nx;if(seen.has(j))continue;
      const h=elev[j]-(tile[j]<=WATER?40:0)+Math.random()*2.5;
      if(h<bh){bh=h;best=j;}
    }
    if(best<0)break;
    if(elev[best]>elev[i])elev[best]=Math.max(SL,elev[i]-1);
    if(st>40&&elev[best]>=elev[i]&&Math.random()<.02){
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(inB(nx,ny)){const j=ny*W+nx;if(tile[j]!==MOUNT&&tile[j]!==SNOW){elev[j]=SL-6;setTile(j,WATER);}}}
      return true;
    }
    i=best;
  }
  return true;
}
/* the oceans rise or fall a step at a time */
function seaStep(){
  if(SL===seaGoal)return;
  const up=SL<seaGoal;SL+=up?1:-1;
  /* only the shore line at the old and new level changes; inland lakes keep their water */
  const edgeE=up?SL-1:SL;
  for(let i=0;i<N;i++){
    const t=tile[i],wet=t<=WATER;
    if(elev[i]===edgeE&&(up?!wet:wet))reclass(i,false);
    else if(wet&&t===WATER&&elev[i]<SL-30){tile[i]=DEEP;touch(i);}
    else if(wet&&t===DEEP&&elev[i]>=SL-30){tile[i]=WATER;touch(i);}
  }
  regionsDirty=true;dirtyOver=true;
  if(SL===seaGoal)chron(SL>100?'The great flood reaches its height':SL<100?'The seas have fallen to their lowest':'The seas return to their old shores','disaster');

/* ---------- weather: storms drift with the wind ---------- */
const WIND={x:.035,y:.008};
function stormsStep(){
  if(S.weather&&tick%YEAR===0&&storms.length<6&&Math.random()<.55){
    const i=randomTile(j=>tile[j]>WATER,60);
    if(i>=0){
      const x=i%W,y=(i/W)|0,thunder=Math.random()<.35;
      storms.push({x,y,r:6+Math.random()*9,t:0,life:(5+Math.random()*9)*YEAR|0,thunder,id:uid++});
    }
  }
  let w=0;
  for(const s of storms){
    s.t++;s.x+=WIND.x*(1+Math.sin(s.t*.01+s.id)*.5);s.y+=WIND.y+Math.sin(s.t*.007+s.id)*.02;
    if(tick%8===0){
      const r=s.r,R=Math.ceil(r);
      for(let m=0;m<12;m++){
        const dx=(Math.random()*2-1)*R,dy=(Math.random()*2-1)*R;if(dx*dx+dy*dy>r*r)continue;
        const x=Math.round(s.x+dx),y=Math.round(s.y+dy);if(!inB(x,y))continue;
        const i=y*W+x;
        if(fire[i]){fire[i]=0;touch(i);}
        if(tile[i]===ASH&&Math.random()<.3)setTile(i,soil[i]===HILL?HILL:soil[i]);
        else if(tile[i]===LAVA&&Math.random()<.1)setTile(i,HILL,true);

    }
    if(s.thunder&&Math.random()<.006)strike(Math.round(s.x+(Math.random()-.5)*s.r),Math.round(s.y+(Math.random()-.5)*s.r));
    if(s.t<s.life&&s.x<W+20&&s.y<H+20&&s.y>-20)storms[w++]=s;

function stormAmt(s){return Math.min(1,s.t/120,(s.life-s.t)/120);}
/* ---------- reading the land: heights in metres, peaks, the readout ---------- */
/* heights in metres: plains up to 900 m, hills to 2,200, mountains to 4,200, peaks to 8,000 */
function metres(e){
  const d=e-SL;if(d<0)return-Math.round(-d*60/10)*10;

function fmtM(m){return(m<0?'-':'')+Math.abs(m).toLocaleString('en-US')+' m';}
let spotCache={t:0,list:[]};
function drawSpotHeights(ox,oy,z,x0,y0,x1,y1){

      for(let y=cy;y<Math.min(yb,cy+cell);y++)for(let x=cx;x<Math.min(xb,cx+cell);x++){const i=y*W+x;if(elev[i]>be){be=elev[i];bi=i;}}
      if(bi<0||be-SL<25)continue;

      for(let dy=-2;dy<=2&&top;dy++)for(let dx=-2;dx<=2;dx++){const x=bx+dx,y=by+dy;if(inB(x,y)&&elev[y*W+x]>be){top=false;break;}}

/* the height under the pointer */
function drawReadout(ox,oy,z){

/* ---------- sculpting: strength, smoothing, ridges, valleys, terraces, erosion ---------- */
let sculptStr=5,flatGoal=-1,strokeSeed=0;
function sculptStart(){flatGoal=-1;strokeSeed=(Math.random()*9999)|0;}
const sround=v=>Math.max(0,Math.min(255,Math.floor(v+Math.random())));
function vnoise(x,y){
  const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hsh(xi,yi),b=hsh(xi+1,yi),c=hsh(xi,yi+1),d=hsh(xi+1,yi+1);
  return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;
}
function sculpt(id,tx,ty){
  const k=sculptStr/5,touched=[];
  if(id==='smooth'){
    const upd=[];
    terraBrush(tx,ty,(i,f,x,y)=>{let s=0,n=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;if(inB(xx,yy)){s+=elev[yy*W+xx];n++;}}upd.push(i,s/n,f);});
    for(let m=0;m<upd.length;m+=3){const i=upd[m];elev[i]=sround(elev[i]+(upd[m+1]-elev[i])*Math.min(1,.55*upd[m+2]*k));touched.push(i);}
  }else if(id==='flatten'){
    if(flatGoal<0&&inB(tx,ty))flatGoal=elev[ty*W+tx];
    terraBrush(tx,ty,(i,f)=>{elev[i]=sround(elev[i]+(flatGoal-elev[i])*Math.min(1,.4*f*k));touched.push(i);});
  }else if(id==='roughen'){
    terraBrush(tx,ty,(i,f,x,y)=>{const n=vnoise(x*.45+strokeSeed,y*.45)*.65+vnoise(x*1.1+strokeSeed,y*1.1+7)*.35;elev[i]=sround(elev[i]+(n-.5)*7*f*k);touched.push(i);});
  }else if(id==='ridge'){
    terraBrush(tx,ty,(i,f,x,y)=>{const n=1-Math.abs(2*vnoise(x*.32+strokeSeed,y*.32)-1),r=n*n;elev[i]=sround(elev[i]+(1.5+r*7)*Math.pow(f,1.3)*k);touched.push(i);});
  }else if(id==='valley'){
    terraBrush(tx,ty,(i,f)=>{elev[i]=sround(elev[i]-Math.pow(f,1.8)*7*k);touched.push(i);});
  }else if(id==='terrace'){
    terraBrush(tx,ty,(i,f)=>{const d=elev[i]-SL;if(d<0)return;const goal=SL+Math.round(d/9)*9;elev[i]=sround(elev[i]+(goal-elev[i])*Math.min(1,.5*f*k));touched.push(i);});
  }else if(id==='erode'){
    for(let it=0;it<2+((k*2)|0);it++)terraBrush(tx,ty,(i,f,x,y)=>{
      let lo=-1,le=elev[i];
      for(let n=0;n<8;n++){const xx=x+DIRS[n][0],yy=y+DIRS[n][1];if(!inB(xx,yy))continue;const j=yy*W+xx;if(elev[j]<le){le=elev[j];lo=j;}}

/* ---------- water finds its way: basins fill into lakes, rain gathers into rivers ---------- */
function letWaterFlow(){
  /* old rivers dry up first, so the new network follows today's land */
  for(let i=0;i<N;i++)if(tile[i]===RIVER&&!bmap[i]){const n=bandOf(elev[i])===0?biomeFor(i):HILL;setTile(i,n);soil[i]=soilFor(n);}
  const F=new Int16Array(N),seen=new Uint8Array(N),parent=new Int32Array(N).fill(-1),order=new Int32Array(N);
  const qs=[],qh=new Int32Array(512);for(let l=0;l<512;l++)qs.push([]);
  let on=0,cur=0;
  const push=(i,l)=>{qs[l].push(i);if(l<cur)cur=l;};
  for(let i=0;i<N;i++){
    const x=i%W,y=(i/W)|0,edge=x===0||y===0||x===W-1||y===H-1;
    if((tile[i]<=WATER&&elev[i]<SL)||edge){seen[i]=1;F[i]=elev[i];push(i,elev[i]);}
  }

  for(;;){

/* ---------- empty worlds to sculpt from scratch ---------- */
function blankWorld(kind,rnd){

let brush=2;
function forBrush(tx,ty,fn){

    if(dx*dx+dy*dy>lim)continue;

function killNear(x,y,r){
  const rr=r*r;

  for(const b of boats)if(!b.dead&&(b.x-x)*(b.x-x)+(b.y-y)*(b.y-y)<=rr){b.dead=true;b.cargo=[];fx({k:'boom',x:b.x,y:b.y,r:1.5,t:10,T:10});}

function kingdomAt(tx,ty){

}
let lastBrushSnd=0;
function applyBrush(tx,ty,tool){
  if(now()-lastBrushSnd>180){lastBrushSnd=now();const id=tool.id;snd(tool.sculpt?'rumble':id==='fire'?'fire':id==='rain'?'water':id==='smite'?'boom':'paint',tx,ty,.5);}
  if(tool.tile!==undefined){forBrush(tx,ty,i=>setTile(i,tool.tile,true));return;}
  switch(tool.id){

    case'lower':raiseLand(tx,ty,-1);break;
    case'flatten':case'smooth':case'ridge':case'valley':case'terrace':case'roughen':case'erode':sculpt(tool.id,tx,ty);break;
    case'warm':climateBrush(tx,ty,9,0);break;
    case'cool':climateBrush(tx,ty,-9,0);break;
    case'wet':climateBrush(tx,ty,0,12);break;
    case'dry':climateBrush(tx,ty,0,-12);break;
    case'plant':plantTrees(tx,ty);break;
    case'fire':forBrush(tx,ty,i=>{if(Math.random()<.6)ignite(i);});break;
    case'rain':
      forBrush(tx,ty,(i,x,y)=>{
        if(fire[i]){fire[i]=0;touch(i);}const t=tile[i];
        if(t===ASH)setTile(i,soil[i]===HILL?HILL:soil[i]);
        else if(t===LAVA)setTile(i,HILL,true);
        else if(t===DESERT&&Math.random()<.05)setTile(i,SAVANNA,true);
        else if(t===GRASS&&!vown[i]&&!bmap[i]&&Math.random()<.03)setTile(i,FOREST);
        if(Math.random()<.25)fx({k:'rain',x:x+Math.random(),y:y+Math.random(),t:6+((Math.random()*6)|0)});
      });
      break;
    case'smite':killNear(tx,ty,brush-.2);break;
    case'plague':{
      const rr=(brush-.2)*(brush-.2);
      for(const u of units)if(u.t<=ORC&&!u.sick&&(u.x-tx)*(u.x-tx)+(u.y-ty)*(u.y-ty)<=rr){u.sick=200;u.immune=false;}
      break;
    }
    case'bless':{
      const rr=(brush+.5)*(brush+.5);
      for(const u of units)if((u.x-tx)*(u.x-tx)+(u.y-ty)*(u.y-ty)<=rr&&u.t<=ORC){u.hp=SPEC[u.t].hp;u.sick=0;u.immune=true;}
      forBrush(tx,ty,i=>{if(fire[i]){fire[i]=0;touch(i);}if(tile[i]===ASH)setTile(i,soil[i]===HILL?HILL:soil[i]);const b=bmap[i];if(b){b.hp=Math.max(b.hp,b.kind==='hall'?hallHp(b.v):BHP[b.kind]);b.v.res+=2;}});
      if(Math.random()<.5)fx({k:'ring',x:tx,y:ty,r:brush+1,t:16,T:16});

}
function spawnBrush(tx,ty,type){

function strike(tx,ty){

function blast(tx,ty,r,lava){
  for(let dy=-r-3;dy<=r+3;dy++)for(let dx=-r-3;dx<=r+3;dx++){
    const x=tx+dx,y=ty+dy;if(!inB(x,y))continue;
    const d=Math.sqrt(dx*dx+dy*dy),i=y*W+x;
    if(d<=r){
      const b=bmap[i];if(b)destroyBld(b);

function stirWar(tx,ty){

function updDay(dt,running){
  if(S.night){
    if(running)dayClock=(dayClock+dt/1000)%150;
    const p=dayClock/150;
    nightF=p<.56?0:p<.66?(p-.56)/.1:p<.9?1:(1-p)/.1;
  }else{nightF=0;}
  const p=S.night?dayClock/150:.3,a=((p+.06)%1)/.68*Math.PI;

}

uniform vec2 uRes,uCam,uWind;uniform vec3 uAmb;uniform float uZoom,uFade;
uniform vec4 uSt[6];uniform int uNSt;

void main(){
  vec2 fc=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y);
  vec2 wp=uCam+fc/uZoom;
  vec2 cp=(floor(wp*4.)+.5)/4.;
  float st=uNSt>0?stormAt(cp):0.;

  if(d<.6)discard;

const SH_SPRITE_VS=`#version 300 es
precision highp float;precision highp int;
layout(location=0) in vec2 aC;
layout(location=1) in vec4 iA;
layout(location=2) in vec4 iB;
layout(location=3) in vec4 iT;
layout(location=4) in vec4 iF;
uniform highp sampler2D uFr;uniform vec2 uRes,uCam,uAt;uniform float uZoom;
out vec2 vUV;out vec4 vT,vF;out float vA;flat out int vFl;out vec2 vW;

const SH_SPRITE_FS=`#version 300 es
precision highp float;precision highp int;
uniform highp sampler2D uAtl,uNz;uniform int uMode;uniform float uNight,uDay,uCloud;uniform vec2 uAt,uWind,uSun;uniform vec3 uLit;

}
/* one tile's entries in the three data textures */
function glTileData(R,i){
  const t=tile[i],o=i*4,b=bmap[i];

  if(b){if(b.kind==='farm')fl|=b.grove?4:2;else if(b.kind!=='dock'&&b.kind!=='mine'&&b.kind!=='wall')fl|=8;}
  const vid=vown[i];let kid=0,tier=0;
  if(vid){const v=vById[vid];if(v&&v.alive){kid=v.k.id;tier=TIER[v.k.age]||0;}}
  const rd=road[i];
  R.dT[o]=t;R.dT[o+1]=fl;R.dT[o+2]=temp[i];R.dT[o+3]=rd?((rd&3)|(Math.max(rd>>2,0)<<2)):0;

function mkList(n,st){const b=new ArrayBuffer(n*st);return{b,f:new Float32Array(b),u:new Uint32Array(b),n:0,cap:n,st};}

const rgbU=(r,g,b)=>(r|g<<8|b<<16|255<<24)>>>0;

/* atlas lookups by name, with graceful fallbacks while art is missing */
const fcache=new Map();
function FI(name){
  let v=fcache.get(name);if(v!==undefined)return v;
  const idx=G.atlas.idx;
  if(idx[name]!==undefined)v=idx[name];
  else{
    const p=name.split('_');
    for(let k=p.length-1;k>0&&v===undefined;k--)if(/^\d+$/.test(p[k])&&p[k]!=='0'){p[k]='0';const n=p.join('_');if(idx[n]!==undefined)v=idx[n];}
    if(v===undefined){const n=name.replace(/_[edo]_/,'_h_');if(idx[n]!==undefined)v=idx[n];}
    if(v===undefined)v=idx.box!==undefined?idx.box:0;
  }
  fcache.set(name,v);return v;

  const s=((seasonP-.125+1)%1)*4,a=s|0,f=s-a,b=(a+1)&3,P=FOL[fam];
  let ca=P[a],cb=P[b];
  if(fam==='oak'||fam==='bush'){const au=AUT[var_&3];if(a===2)ca=au;if(b===2)cb=au;}

function snowAt(i){

function sceneNature(x0,y0,x1,y1,zc,night){

          put(L,FI((sn?'pinesnow_':'pine_')+((h*3)|0)),x+.55+jx,dy,depthY(dy),0,tP,h2>.5?1:0,al,1,.95+h2*.15);
