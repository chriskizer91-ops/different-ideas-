/* ---------- buildings ---------- */
function bldFrame(b,v,k){
  const r=RACE_L[v.race]||'h',t=TIER[k.age]||0,vv=(b.x*7+b.y*13)&1;
  switch(b.kind){
    case'house':{
      if(t>=3){const dd=Math.hypot(b.x-v.x,b.y-v.y);if(dd<v.rad*.62)return FI('tall_'+r+'_'+t+'_'+((b.x*5+b.y*3)%3));}
      return FI('house_'+r+'_'+t+'_'+vv);
    }
    case'hall':return FI('hall_'+r+'_'+t);
    case'temple':return FI('temple_'+r+'_'+t);
    case'tower':return FI('tower_'+t);
    case'barracks':return FI('barracks_'+t);
    case'market':return FI('market_'+t);
    case'academy':return FI('academy_'+Math.max(1,t));
    case'mine':return FI('mine_'+t);
    case'dock':return FI('dockhut_'+t);
    case'farm':return b.grove?FI('grove'):-1;
    case'wall':{
      const wt=Math.max(1,Math.min(3,t)),h=(j)=>{const o=bmap[j];return o&&(o.kind==='wall'||o.kind==='tower')&&o.v.k===k;};
      return FI((h(b.i-1)||h(b.i+1)||!(h(b.i-W)||h(b.i+W))?'wall_':'wallv_')+wt);
    }
    case'windmill':return FI((t>=4?'turbine_':'windmill_')+(((now()/(t>=4?160:260))|0)+b.x)%3);
    case'factory':return FI('factory_'+Math.max(3,t));
    case'lighthouse':return FI('lighthouse_'+Math.max(1,t));
    case'arena':return FI(t>=3?'arena_4':'arena_1');
    case'launchpad':return FI('launchpad');
    case'wonder':return FI('wonder_'+b.wid);
    default:return FI(b.kind+'_'+t);
  }
}
const LRAD={hall:3.4,house:1.9,temple:2.6,tower:2.2,barracks:2.2,market:2.4,academy:2.4,mine:1.6,dock:1.8,wall:0,windmill:1.4,factory:3,lighthouse:2.4,arena:4,launchpad:4,wonder:5};
/* chimney smoke: a few puffs on a loop, drawn from time alone */
function smokePlume(x,y,seed,tsec,big,n){
  for(let m=0;m<n;m++){
    const p=(tsec*(big?.32:.45)+m/n+seed*.137)%1;
    put(SPR.mn,FI('smoke_'+(p<.3?0:p<.65?1:2)),x+Math.sin(p*5+seed)*.25+p*.6,y-p*(big?3.2:2),.007,0,0,4,(1-p)*(big?.55:.4),1,(big?1.1:.7)+p*.8);
  }
}
function sceneBuildings(x0,y0,x1,y1,zc,night,tsec){
  if(zc<1.6)return;
  const L=SPR.mn,S2=SPR.sh;
  for(let n=1;n<vById.length;n++){
    const v=vById[n];if(!v.alive)continue;
    const m=v.rad+6;if(v.x+m<x0||v.x-m>x1||v.y+m<y0||v.y-m>y1)continue;
    const k=v.k,team=kU(k);
    for(const b of v.blds){
      if(b.x<x0-2||b.x>x1+2||b.y<y0-2||b.y>y1+4)continue;
      const fy=b.y+.95,crop=b.prog===undefined?1:Math.max(.08,b.prog);
      if(b.kind==='farm'){
        if(b.grove)put(L,FI('grove'),b.x+.5,b.y+.8,depthY(b.y+.8),team,folTint('oak',0),0,1,1,1);
        else if(((b.x*31+b.y*17)%9)===0)put(L,FI(((b.x+b.y)&1)?'haystack':'scarecrow'),b.x+.5,b.y+.75,depthY(b.y+.75),team,0,0,1,1,1);
        continue;
      }
      if(b.kind==='dock'){
        const wx=(b.wi%W)-b.x,wy=((b.wi/W)|0)-b.y;
        if(wx)put(L,FI('pierh'),b.x+.5,b.y+.6,depthY(b.y+.2),team,0,wx<0?1:0,1,1,1);
        else put(L,FI('pierv'),b.x+.5,wy>0?b.y+.5:b.y-.9,depthY(b.y+(wy>0?1.4:.3)),team,0,0,1,1,1);
      }
      const fr=bldFrame(b,v,k);if(fr<0)continue;
      const seed=((b.x*73+b.y*151)&4095)<<4,big=b.big===2,bx=b.x+(big?1:.5),by=big?b.y+1.95:fy;
      put(L,fr,bx,by,depthY(by),team,0,seed,1,crop,1);
      if(crop<1)put(L,FI(big?'scaffold2':'scaffold'),bx,by,depthY(by)-.0005,team,0,0,1,1,1);
      if(b.solid&&zc>=3&&b.kind!=='wall')put(S2,FI(big?'shadowbig':'shadow'),bx-sunX*.25,by-.05-sunY*.12,0,0,0,8,.22*dayLight,1,b.kind==='hall'?1.9:1.1);
      const lr=LRAD[b.kind];
      if(night&&b.solid&&crop>=1&&lr!==0)light(bx,by-.6,lr||2,.58,LAMP);
      if(crop>=1&&zc>=2.5){
        if(b.kind==='factory')smokePlume(bx+.1,by-1.9,b.x+b.y,tsec,true,5);
        else if(b.kind==='house'&&(TIER[k.age]||0)===3&&((b.x*3+b.y)&3)===0)smokePlume(bx+.2,by-1.4,b.x*7+b.y,tsec,false,3);
        else if(b.kind==='hall'&&(TIER[k.age]||0)===0)smokePlume(bx-.3,by-1.2,b.x,tsec,false,3);
        else if(b.kind==='launchpad'&&!b.v.k.flying)put(L,FI('rocket'),bx+.05,by-.35,depthY(by)-.001,team,0,0,1,1,1);
      }
      if(night&&b.kind==='lighthouse'&&crop>=1){
        const a=tsec*1.4,dx=Math.cos(a),dy=Math.sin(a)*.6;
        for(let m=1;m<=4;m++)light(bx+dx*m*1.6,by-1.4+dy*m*1.6,.9+m*.35,.55-m*.08,COOLL);
      }
      if(fire[b.i]){
        put(SPR.po,FI('flame_'+((frameNo>>2)+b.x)%4),b.x+.5,b.y+.6,depthY(b.y+.98),0,0,0,1,1,1.3);
        if(night)light(b.x+.5,b.y+.4,2.4,.9,FIREL);
      }
    }
  }
}

/* ---------- people, beasts, boats ---------- */
function sceneUnits(x0,y0,x1,y1,zc,lerp,tsec,night){
  if(zc<1.1)return;
  const L=SPR.mn,S2=SPR.sh,small=zc<3,shad=zc>=4;
  for(let n=0;n<units.length;n++){
    const u=units[n];
    if(u.x<x0||u.x>x1||u.y<y0||u.y>y1)continue;
    let px=u.px===undefined?u.x:u.px,py=u.py===undefined?u.y:u.py;
    if(Math.abs(px-u.x)>1.5||Math.abs(py-u.y)>1.5){px=u.x;py=u.y;}
    const rx=px+(u.x-px)*lerp+.5+u.ox,ry=py+(u.y-py)*lerp+.5+u.oy+.3;
    const moving=u.x!==px||u.y!==py,ph=moving?1+(((tsec*7)|0)+u.id)%2:0,t=u.t,fl=u.dir<0?1:0;
    let fr,team=0,sc=1;
    if(t<=ORC){
      const k=u.k;team=k?kU(k):PLAIN_U[t];
      const kid=u.age<SPEC[t].adult;sc=kid?.7:1;
      if(u.soldier&&k){const ti=TIER[k.age]||0;fr=FI(RACE_L[t]+'_sol'+ti+'_'+(u.cd>1&&u.foe?3:ph));}
      else fr=FI(RACE_L[t]+'_civ_'+ph);
    }else if(t===DRAGON){
      const f=((tsec*6)|0)%3;
      put(L,FI('dragon_'+f),rx,ry-1.6,.004,0,0,fl|4,1,1,1.4);
      put(S2,FI('shadowbig'),rx,ry+.2,0,0,0,8,.2,1,1);
      continue;
    }else if(t===SIEGE&&u.k){
      const a=u.k.age;team=kU(u.k);
      fr=FI('siege_'+(a>=7?4:a>=5?3:a>=4?2:1));
    }else if(t===CARAVAN&&u.k){
      const ti=TIER[u.k.age]||0,onRoad=road[u.y*W+u.x]!==0;team=kU(u.k);
      if(ti===3&&onRoad){
        fr=FI('train_3');
        const tr=u.trail;
        if(tr&&zc>=2.5)for(let m=0;m<2&&m<tr.length;m++){const c=tr[m];put(L,FI('traincar_3'),c.x+.5,c.y+.85,depthY(c.y+.85),team,0,fl,1,1,1);}
      }else fr=FI(ti>=4?'truck_4':'cart_'+Math.min(2,ti));
    }else{
      const nm=t===SHEEP?'sheep_':t===WOLF?'wolf_':t===BEAR?'bear_':t===ZOMBIE?'zombie_':'box_';
      fr=FI(nm+(moving?(((tsec*6)|0)+u.id)%(t===ZOMBIE?3:2):0));
    }
    if(small)sc*=Math.min(2.4,2.6/Math.max(.5,zc*.6));
    put(L,fr,rx,ry,depthY(ry),team,0,fl,1,1,sc);
    if(shad)put(S2,FI('shadow'),rx,ry,0,0,0,8,.2*dayLight,1,.42*sc);
    if(u.sick&&zc>=4)put(SPR.po,FI('spark'),rx,ry-.9,0,rgbU(126,224,74),0,0,1,1,.8);
  }
  for(const b of boats){
    if(b.x<x0-1||b.x>x1+1||b.y<y0-1||b.y>y1+1)continue;
    let px=b.px===undefined?b.x:b.px,py=b.py===undefined?b.y:b.py;
    const rx=px+(b.x-px)*lerp+.5,ry=py+(b.y-py)*lerp+.6+Math.sin(tsec*2+b.x)*.03;
    put(L,FI('boat_'+(TIER[b.k.age]||0)),rx,ry,depthY(ry),kU(b.k),0,b.dir<0?1:0,1,1,1);
    if(night)light(rx,ry-.3,1.4,.4,LAMP);
  }
  for(const p of planes){
    const rx=p.px+(p.x-p.px)*lerp+.5,ry=p.py+(p.y-p.py)*lerp+.5;
    if(rx<x0-4||rx>x1+4||ry<y0-4||ry>y1+6)continue;
    put(SPR.sk,FI('plane_'+((tsec*12|0)&1)),rx,ry-2.6,.001,kU(p.k),0,(p.dir<0?1:0)|4,1,1,1.2);
    put(S2,FI('shadow'),rx,ry+.3,0,0,0,8,.18,1,.9);
  }
  /* fishing boats bob about every harbour */
  if(zc>=2.5)for(let n=1;n<vById.length;n++){
    const v=vById[n];if(!v.alive||!v.dock)continue;
    const d=v.dock,wx=d.wi%W,wy=(d.wi/W)|0;if(wx<x0||wx>x1||wy<y0||wy>y1)continue;
    const a=tsec*.18+n,ox=Math.cos(a)*1.3,oy=Math.sin(a*1.3)*.9,tx=Math.round(wx+ox),ty=Math.round(wy+oy);
    const ok=inB(tx,ty)&&tile[ty*W+tx]<=WATER;
    const fx2=ok?wx+ox:wx,fy2=ok?wy+oy:wy;
    put(L,FI('fishboat'),fx2+.5,fy2+.65+Math.sin(tsec*2.2+n)*.04,depthY(fy2+.65),kU(v.k),0,Math.sin(a)>0?1:0,1,1,1);
  }
  for(const tw of twisters){
    if(tw.x<x0-3||tw.x>x1+3||tw.y<y0-3||tw.y>y1+8)continue;
    for(let n=0;n<9;n++){
      const a=tsec*5+n*.8,r=.15+n*.09;
      put(L,FI('smoke_'+Math.min(2,(n/3)|0)),tw.x+.5+Math.sin(a)*r*1.5,tw.y+.8-n*.55,depthY(tw.y+1)-.001*n,0,0,0,.85,1,.8+n*.18);
    }
  }
}

/* ---------- effects ---------- */

      case'arrow':{const p=1-e.t/e.T,ax=e.x+(e.x2-e.x)*p+.5,ay=e.y+(e.y2-e.y)*p+.3-Math.sin(p*3.14)*.8;

      case'rain':put(P,FI('raindrop'),e.x,e.y-e.t*.5,.003,0,0,0,.9,1,1);break;
      case'shot':{const p=1-e.t/e.T,ax=e.x+(e.x2-e.x)*p+.5,ay=e.y+(e.y2-e.y)*p+.3-Math.sin(p*3.14)*1.6;
        put(P,FI(e.s),ax,ay,.003,0,0,0,1,1,1);break;}
      case'rocket':{

        if(p>.04)put(SPR.sk,FI('exhaust_'+((frameNo>>1)%3)),rx,ry-.95,.0016,0,0,4,1,1,(e.colony?1.5:1)*(p<.12?.6+p*3:1.2));
        for(let m=0;m<10;m++){const q=(m/10+frameNo*.004)%1,sy=ry-.2+q*Math.min(lift,14)*.9;if(lift>.3||m<3)put(L,FI('smoke_'+(q<.3?0:q<.6?1:2)),rx+Math.sin(m*1.7+q*4)*(.2+q*1.4),sy,.006,0,0,4,(1-q)*.55,1,.8+q*2.2);}
        light(rx,ry,3+(e.colony?2:0),1.1,FIREL);

function sceneCollect(R,cx,cy,z,lerp,tsec){
  for(const k in SPR)SPR[k].n=0;
  if(R.noSprites||topoMap)return;
  const zc=cam.z,x0=Math.floor(cx)-2,y0=Math.floor(cy)-2,x1=Math.ceil(cx+cv.width/z)+2,y1=Math.ceil(cy+cv.height/z)+4;
  const night=nightF>.02;
  sceneNature(x0,y0,x1,y1,zc,night);
  sceneBuildings(x0,y0,x1,y1,zc,night,tsec);
  sceneUnits(x0,y0,x1,y1,zc,lerp,tsec,night);
  sceneEffects(x0,y0,x1,y1,night);
  sceneAmbient(x0,y0,x1,y1,zc,tsec,night);
  if(night&&zc>=1.6){
    for(let n=0;n<fireList.length;n++){
      const i=fireList[n],fx2=i%W,fy=(i/W)|0;
      if(fire[i]&&fx2>=x0&&fx2<=x1&&fy>=y0&&fy<=y1&&!bmap[i])light(fx2+.5,fy+.5,2,.7+Math.random()*.2,FIREL);
    }
  }
  if(zc>=2.5){
    for(let n=0;n<fireList.length;n++){
      const i=fireList[n],fx2=i%W,fy=(i/W)|0;
      if(fire[i]&&!bmap[i]&&fx2>=x0&&fx2<=x1&&fy>=y0&&fy<=y1)put(SPR.po,FI('flame_'+((frameNo>>2)+fx2+fy)%4),fx2+.5,fy+.85,depthY(fy+.85),0,0,0,1,1,1);
    }

}

/* ---------- the frame ---------- */
const FW_COL=['#ff6b6b','#ffd93d','#6bcBff','#c38bff','#7dffb0','#ffffff','#ff9f43'];
const PLAIN_U=[rgbU(210,201,180),rgbU(159,198,154),rgbU(163,154,140),rgbU(93,74,54)];
let topoMap=false;
function glFrame(R,dt,running,lerp){
  const gl=R.gl;frameNo++;
  topoMap=S.topo==='map';
  if(R.lost)return;
  if(!R.dT||R.W!==W)R.setWorld();
  R.flush();
  if(view3d){topoMap=S.topo==='map';seasonP=((tick%YEAR)+Math.max(0,Math.min(1,lerp)))/YEAR;rel3dFrame(R);return;}
  const cw=cv.width,ch=cv.height,z=cam.z*gdpr,tsec=now()/1000;
  let cx=cam.x,cy=cam.y;
  if(shake>0){cx+=(Math.random()-.5)*shake/cam.z*.5;cy+=(Math.random()-.5)*shake/cam.z*.5;shake*=.88;if(shake<.4)shake=0;}

  seasonAmp+=(sTarget-seasonAmp)*Math.min(1,dt/900);

  FOL_U=folTint('bush',2);
  const tc0=now();
  sceneCollect(R,cx,cy,z,Math.max(0,Math.min(1,lerp)),tsec);
  R.tScene=R.tScene*.9+(now()-tc0)*.1;R.nSpr=SPR.mn.n+SPR.sh.n+SPR.po.n;

  const wind=[tsec*.0035,tsec*.0011];
  const stv=new Float32Array(24);let nst=0;
  for(const s of storms){if(nst>=6)break;stv.set([s.x,s.y,s.r,stormAmt(s)],nst*4);nst++;}
  const setSt=u=>{gl.uniform1i(u.uNSt,nst);if(nst)gl.uniform4fv(u.uSt,stv);};
  gl.viewport(0,0,cw,ch);
  gl.disable(gl.BLEND);gl.disable(gl.DEPTH_TEST);gl.depthMask(true);gl.clearDepth(1);gl.clear(gl.DEPTH_BUFFER_BIT);
  /* terrain */

  const bindT=(unit,t,loc)=>{gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);if(loc)gl.uniform1i(loc,unit);};
  bindT(0,R.tTerr,uT.uTerr);bindT(1,R.tSm,uT.uSm);bindT(2,R.tOwn,uT.uOwn);bindT(3,R.tKPal,uT.uKPal);bindT(4,R.tBio,uT.uBio);bindT(5,R.tNz,uT.uNz);
  gl.uniform2f(uT.uRes,cw,ch);gl.uniform2f(uT.uCam,cx,cy);gl.uniform2f(uT.uWorld,W,H);gl.uniform2f(uT.uSun,sunX,sunY);gl.uniform2f(uT.uWind,wind[0],wind[1]);

  draw(SPR.po,R.vPost,2);

  /* clouds high above */

/* the 2D layer on top: names, speech, lightning, rings */
function glOverlay(cx,cy){
  const z=cam.z*dpr,ox=-cx*z,oy=-cy*z;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,ovc.width,ovc.height);
  const x0=cx-3,y0=cy-3,x1=cx+vw/cam.z+3,y1=cy+vh/cam.z+3;
  for(const e of effects){
    const px=ox+(e.x+.5)*z,py=oy+(e.y+.5)*z;
    if(e.k==='bolt'){
      const r=mulberry(e.seed);
      ctx.strokeStyle=e.t>5?'#ffffff':'#ffe66b';ctx.lineWidth=Math.max(2*dpr,z*.18);ctx.lineCap='round';
      ctx.beginPath();let x=px,y=py;ctx.moveTo(x,y);
      while(y>0){y-=z*2+r()*z*2+8;x+=(r()-.5)*z*4;ctx.lineTo(x,y);}
      ctx.stroke();
      if(e.t>7&&!reduceMotion){ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(0,0,ovc.width,ovc.height);}
    }else if(e.k==='ring'){
      const p=1-e.t/e.T;ctx.globalAlpha=Math.max(0,1-p);ctx.strokeStyle='#ffe98a';ctx.lineWidth=Math.max(2,z*.25);
      ctx.beginPath();ctx.arc(px,py,e.r*z*(.2+.8*p),0,6.283);ctx.stroke();ctx.globalAlpha=1;
    }else if(e.k==='fireworks'){
      const el=e.T-e.t,r=mulberry(e.x*977+e.y*31);
      if(el%11===1)snd('firework',e.x,e.y,.6);
      ctx.globalCompositeOperation='lighter';
      for(let b=0;b*11<=el;b++){
        const bx=e.x+(r()-.5)*12,by=e.y-3-r()*7,col=FW_COL[(r()*FW_COL.length)|0],age=el-b*11;
        if(age>34)continue;
        const cx2=ox+(bx+.5)*z,cy2=oy+(by+.5)*z,rad=Math.sqrt(age/34)*z*2.4,a=1-age/34,sz=Math.max(2,z*.16);
        ctx.fillStyle=col;ctx.globalAlpha=a;
        for(let m=0;m<14;m++){const an=m/14*6.283;ctx.fillRect(cx2+Math.cos(an)*rad-sz/2,cy2+Math.sin(an)*rad+age*age*.002*z-sz/2,sz,sz);}
      }
      ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    }else if(e.k==='meteor'){
      const p=e.t/28,mx=px+p*z*16,my=py-p*z*26;
      const g=ctx.createLinearGradient(mx+z*6,my-z*10,mx,my);g.addColorStop(0,'rgba(255,120,40,0)');g.addColorStop(1,'rgba(255,200,90,.9)');
      ctx.strokeStyle=g;ctx.lineWidth=Math.max(3,z*.9);ctx.beginPath();ctx.moveTo(mx+z*6,my-z*10);ctx.lineTo(mx,my);ctx.stroke();
      ctx.fillStyle='#ffcf5a';ctx.beginPath();ctx.arc(mx,my,Math.max(3,z*1.1),0,6.283);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx,my,Math.max(1.5,z*.5),0,6.283);ctx.fill();
    }
  }
  if(topoMap)drawSpotHeights(ox,oy,z,x0,y0,x1,y1);
  drawNames(ox,oy,z,x0,y0,x1,y1);
  drawCursor(ox,oy,z);
  if(topoMap||S.contours)drawReadout(ox,oy,z);
  if(S.minimap&&frameNo%30===0)drawMiniGL();
}
function drawMiniGL(){
  const mw=mini.width,mh=mini.height;if(!mw||!mh)return;

  for(let py=0;py<mh;py++){

      let c=MINI_COL[t];

      const vid=vown[i];
      if(vid&&S.borders){const v=vById[vid];if(v&&v.alive){const kc=v.k.rgb;r+=(kc[0]-r)*.4;g+=(kc[1]-g)*.4;b+=(kc[2]-b)*.4;}}

/* ===== 74-ambient.js ===== */
/* ================= ambient life and weather particles (purely visual) ================= */
const flocks=[],jumps=[],whales=[];let ambLast=0;
const h1=n=>{let h=Math.imul(n|0,2654435761)^0x9e3779b9;h=Math.imul(h^(h>>>15),2246822507);h^=h>>>13;return(h>>>0)/4294967296;};
function sceneAmbient(x0,y0,x1,y1,zc,tsec,night){
  const dt=Math.min(.1,Math.max(0,tsec-ambLast));ambLast=tsec;
  const L=SPR.mn,P=SPR.po,S2=SPR.sh,vwT=x1-x0,vhT=y1-y0;
  /* birds cross the sky in loose V formations */
  if(zc>=1.5){
    const want=night?0:Math.min(4,1+((vwT*vhT)/3000|0));
    if(flocks.length<want&&Math.random()<dt*.35){
      const fromL=Math.random()<.5,y=y0+Math.random()*vhT;
      flocks.push({x:fromL?x0-4:x1+4,y,vx:(fromL?1:-1)*(2.2+Math.random()*1.2),vy:(Math.random()-.5)*.8,n:4+((Math.random()*6)|0),seed:(Math.random()*1e6)|0,life:40});
    }
    let w=0;
    for(const f of flocks){
      f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt;
      if(f.life>0&&f.x>x0-12&&f.x<x1+12&&f.y>y0-12&&f.y<y1+12)flocks[w++]=f;
      for(let m=0;m<f.n;m++){
        const row=(m+1)>>1,side=m&1?1:-1,bx=f.x-Math.sign(f.vx)*row*.7+Math.sin(tsec*1.3+m)*.08,by=f.y+side*row*.45+Math.cos(tsec*1.7+m*2)*.06;
        const flap=((tsec*7+m*.37)|0)&1;
        put(SPR.sk,FI('bird_'+flap),bx,by-2.2,.0012,0,0,(f.vx<0?1:0)|4,1,1,1);
        if(zc>=4&&!night)put(S2,FI('shadow'),bx+.6,by+.4,0,0,0,8,.12,1,.25);
      }
    }
    flocks.length=w;
  }
  if(zc>=3){
    /* fish leap in the shallows */
    if(jumps.length<6&&Math.random()<dt*2.5){
      const x=(x0+Math.random()*vwT)|0,y=(y0+Math.random()*vhT)|0;
      if(inB(x,y)&&tile[y*W+x]===WATER)jumps.push({x:x+Math.random(),y:y+Math.random(),t:0,d:Math.random()<.5?1:-1});
    }
    let w=0;
    for(const j of jumps){
      j.t+=dt/.9;
      if(j.t<1){
        jumps[w++]=j;
        const ax=j.x+j.t*.7*j.d,ay=j.y-Math.sin(j.t*Math.PI)*.55;
        if(j.t>.1&&j.t<.9)put(P,FI('fish'),ax,ay,.004,0,0,j.d<0?1:0,1,1,1);
        if(j.t<.25)put(P,FI('splash'),j.x,j.y+.1,.004,0,0,0,1-j.t*4,1,.8);
        else if(j.t>.8)put(P,FI('splash'),j.x+.7*j.d,j.y+.1,.004,0,0,0,(j.t-.8)*5,1,.8);
      }
    }
    jumps.length=w;
    /* now and then a whale surfaces in the deep */
    if(whales.length<2&&Math.random()<dt*.06){
      const x=(x0+Math.random()*vwT)|0,y=(y0+Math.random()*vhT)|0;
      if(inB(x,y)&&tile[y*W+x]===DEEP&&elev[y*W+x]<SL-35)whales.push({x:x+.5,y:y+.5,t:0,d:Math.random()<.5?1:-1});
    }
    w=0;
    for(const wh of whales){
      wh.t+=dt/7;
      if(wh.t<1){
        whales[w++]=wh;
        const x=wh.x+wh.t*1.2*wh.d,show=wh.t<.75?0:1;
        put(L,FI('whale_'+show),x,wh.y,depthY(wh.y),0,0,wh.d<0?1:0,Math.min(1,wh.t*6,(1-wh.t)*6),1,1);
        if(wh.t>.12&&wh.t<.4)for(let m=0;m<3;m++){const q=((wh.t-.12)/.28+m/3)%1;put(L,FI('smoke_0'),x+.15*wh.d,wh.y-.4-q*.9,.006,0,0,4,(1-q)*.8,1,.6+q*.6);}
      }
    }
    whales.length=w;
  }
  /* fireflies on summer nights */
  if(night&&zc>=3.5&&seasonP>.2&&seasonP<.7){
    const slot=(tsec/3)|0;
    for(let m=0;m<70;m++){
      const hx=h1(m*31+slot*7919),hy=h1(m*57+slot*104729),x=x0+hx*vwT,y=y0+hy*vhT;
      const tx=x|0,ty=y|0;if(!inB(tx,ty))continue;
      const t=tile[ty*W+tx];if(t!==FOREST&&t!==SWAMP&&t!==JUNGLE&&t!==GRASS)continue;
      const blink=Math.sin(tsec*3+m*1.7);if(blink<.2)continue;
      put(P,FI('ember'),x+Math.sin(tsec*.7+m)*.4,y+Math.cos(tsec*.9+m)*.3-.4,.004,0,0,0,blink*nightF,1,.5);
    }
  }
  /* rain and snow under the storms */
  if(zc>=2)for(const s of storms){
    const a=stormAmt(s);if(a<.08)continue;
    if(s.x+s.r<x0||s.x-s.r>x1||s.y+s.r<y0||s.y-s.r>y1)continue;
    const cx=Math.max(0,Math.min(W-1,s.x|0)),cy=Math.max(0,Math.min(H-1,s.y|0)),snow=tEff(cy*W+cx)<.06+.25*wintF;
    const n=Math.min(500,(s.r*s.r*(snow?1.2:2.2)*a)|0);
    for(let m=0;m<n;m++){
      const hr=Math.sqrt(h1(m*13+s.id*977)),ha=h1(m*29+s.id*131)*6.283,ph=(tsec*(snow?.35:1.9)+h1(m*7+s.id))%1;
      const bx=s.x+Math.cos(ha)*hr*s.r,by=s.y+Math.sin(ha)*hr*s.r;
      if(bx<x0||bx>x1||by<y0||by>y1)continue;
      if(snow)put(P,FI('snowflake'),bx+Math.sin(tsec*1.5+m)*.3,by-(1-ph)*2.4,.004,0,0,0,.9*a,1,.8);
      else put(P,FI('raindrop'),bx-(1-ph)*.4,by-(1-ph)*2.2,.004,0,0,0,.65*a,1,1);
    }
  }
}

/* ===== 75-relief.js ===== */
/* ================= 3D relief view: the world as a tabletop model =================
   The 2D scene (terrain, trees, towns) is baked into one large texture, then draped over a
   height mesh built from the elevation field. A glossy sea plane, layered earth sides, sun
   lighting and haze finish the diorama. The simulation keeps running; the bake refreshes. */
const SH_REL_VS=`#version 300 es
precision highp float;
layout(location=0) in vec3 aP;
uniform mat4 uMVP;uniform highp sampler2D uSm;uniform vec2 uWorld;uniform float uHS,uSL,uBase;
out vec2 vUV;out vec3 vN;out float vH;out vec3 vW;

  vec2 p=aP.xy;float h=hAt(p);
  float hx=hAt(p+vec2(1.,0.))-hAt(p-vec2(1.,0.)),hz=hAt(p+vec2(0.,1.))-hAt(p-vec2(0.,1.));
  vN=normalize(vec3(-hx,2.,-hz));
  if(aP.z>.5){h=uBase;vN=vec3(0.,0.,0.);}
  vW=vec3(p.x,h,p.y);vH=h;vUV=vec2(p.x/uWorld.x,1.-p.y/uWorld.y);
  gl_Position=uMVP*vec4(vW,1.);
}`;
const SH_REL_FS=`#version 300 es
precision highp float;
uniform highp sampler2D uBake;uniform vec3 uSun,uAmb,uSunC,uFog,uEye;uniform float uFogN,uFogF,uSkirt,uHS;
in vec2 vUV;in vec3 vN;in float vH;in vec3 vW;out vec4 o;
void main(){
  vec3 c;
  if(uSkirt>.5){
    /* layered earth on the sides of the model */
    float d=-vH/max(uHS,.01);
    float band=floor(d/7.);
    vec3 a=vec3(.42,.3,.2),b=vec3(.55,.42,.3),r=vec3(.5,.47,.44);
    c=mod(band,3.)<1.?a:mod(band,3.)<2.?b:r;
    if(d<2.)c=vec3(.28,.4,.2);
    c*=.62+.18*smoothstep(0.,40.,-d+40.);
    vec3 sn=abs(dFdx(vW).x)>abs(dFdx(vW).z)?vec3(0.,0.,1.):vec3(1.,0.,0.);
    c*=uAmb+uSunC*.5*abs(dot(sn,uSun));
  }else{
    c=texture(uBake,vUV).rgb;

  }

  o=vec4(mix(c,uFog,f*.75),1.);
}`;
const SH_WATER_VS=`#version 300 es
precision highp float;
layout(location=0) in vec3 aP;
uniform mat4 uMVP;uniform vec2 uWorld;
out vec3 vW;
void main(){vW=vec3(aP.x*uWorld.x,0.,aP.y*uWorld.y);gl_Position=uMVP*vec4(vW,1.);}`;
const SH_WATER_FS=`#version 300 es
precision highp float;

in vec3 vW;out vec4 o;
float nz(vec2 p){return texture(uNz,p*.00390625).r;}
void main(){

/* upright sprites standing on the model, turned to face the camera */
const SH_BB_VS=`#version 300 es
precision highp float;precision highp int;
layout(location=0) in vec2 aC;layout(location=1) in vec4 iA;layout(location=2) in vec4 iB;layout(location=3) in vec4 iT;layout(location=4) in vec4 iF;

function toast(msg,type){
  const el=$('log');if(!el)return;
  const d=document.createElement('div');d.textContent=msg;if(type)d.className='t-'+type;
  el.appendChild(d);
  while(el.children.length>2)el.removeChild(el.firstChild);
  setTimeout(()=>{d.classList.add('out');},5200);
  setTimeout(()=>{if(d.parentNode)d.parentNode.removeChild(d);},5900);
}
/* a title card for the great moments of world history */
let bannerTimer=0,worldAge=-1;
function banner(kicker,title,sub){
  if(quiet)return;
  $('bannerKicker').textContent=kicker;$('bannerTitle').textContent=title;$('bannerSub').textContent=sub||'';
  const el=$('banner');el.classList.add('on');clearTimeout(bannerTimer);bannerTimer=setTimeout(()=>{el.classList.remove('on');},5200);
}
let infoTimer=0;
function showInfo(html){const el=$('info');el.innerHTML=html;el.hidden=false;clearTimeout(infoTimer);infoTimer=setTimeout(hideInfo,6500);}
function hideInfo(){$('info').hidden=true;}
const SEASON_ICO=['\u{1F331} Spring','\u2600\uFE0F Summer','\u{1F342} Autumn','\u2744\uFE0F Winter'];
function hud(){
  const sp=((tick%YEAR)/YEAR+.875)%1;
  $('year').textContent='Year '+yearNow()+(S.seasons&&speed<=3?' '+SEASON_ICO[(sp*4)|0].split(' ')[0]:'');
  let best=-1;for(const k of kingdoms)if(k.alive&&k.age>best)best=k.age;
  $('era').textContent=best<0?'Tiny Dominion':AGE_NAME[best];
  let cz=0;for(const k of kingdoms)if(k.alive)cz+=kCitizens(k);
  $('pop').textContent=fmtPop(cz+Math.max(0,civCount()-kingdoms.reduce((a,k)=>a+(k.alive?kPop(k):0),0))*6)+(vw<440?'':' people');
  let n=0;for(const k of kingdoms)if(k.alive)n++;
  $('realmCount').textContent=n===0?'No realms yet':n===1?'1 realm':n+' realms';
}
function veil(on,title,text){
  $('veil').hidden=!on;
  if(title)$('veilTitle').textContent=title;
  $('veilText').textContent=text||'';
}
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
/* ---------- the ruler's mind on the realm page ---------- */
const TEMPER_ADJ={aggr:['bold','peaceable'],caut:['careful','reckless'],ambi:['ambitious','content'],greed:['greedy','generous'],
  zeal:['devout','tolerant'],honor:['honourable','faithless'],curio:['curious','incurious'],cunning:['cunning','plain-dealing']};
function temperWords(tm){
  const a=TEMPER.slice().sort((p,q)=>Math.abs(tm[q]-.5)-Math.abs(tm[p]-.5)).slice(0,3).map(x=>TEMPER_ADJ[x][tm[x]>=.5?0:1]);
  return cap1(a[0])+', '+a[1]+' and '+a[2];
}
function mindHtml(k){
  const tm=tmOf(k),m=k.mind,bar=.28+tm.caut*.15-tm.aggr*.08,sc=u=>Math.max(0,Math.min(100,u*70));
  $('rGoal').textContent='Aim: '+goalText(k.goal)+(k.goal?', for '+Math.max(1,Math.round((tick-k.goal.since)/YEAR))+(Math.round((tick-k.goal.since)/YEAR)>1?' years':' year'):'');
  const cu=cultureOf(k),nt=natOf(k);
  $('rChar').textContent='The ruler is '+lc1(temperWords(tm))+'.';
  $('rPeople').textContent='The '+SPEC[k.race].pl.toLowerCase()+' of '+k.name+' are '+(nt!==1?'a '+NATURES[nt]+' people: ':'')+lc1(temperWords(cu))+'.';
  $('rTemper').innerHTML=TEMPER.map(a=>'<span>'+TEMPER_NAME[a]+'</span><div class="meter" role="img" aria-label="'+TEMPER_NAME[a]+': ruler '+Math.round(tm[a]*100)+', people '+Math.round(cu[a]*100)+' of 100"><i style="width:'+Math.round(tm[a]*100)+'%"></i><s style="left:'+Math.round(cu[a]*100)+'%"></s></div>').join('');
  if(!m||m.small){$('rWeighH').textContent='Weighing this year';$('rDid').textContent=m||k.pop<8?'The realm is too small for statecraft. Its ruler only tends to its people.':'The ruler has not yet sat in council.';$('rWeigh').innerHTML='';}
  else{
    $('rWeighH').textContent='Weighing, year '+m.y;
    const best=m.opts[0];
    $('rDid').textContent=m.did?'Chose: '+m.did+'.':!best?'Nothing to decide this year.':best.u>(m.bar!==undefined?m.bar:bar)?'Tempted by '+optLabel(best).toLowerCase()+', but held back this year.':'Nothing seemed worth the risk, so the ruler waited.';
    $('rWeigh').innerHTML=m.opts.map(p=>{
      const why=p.f.map(x=>'<span class="'+(x[1]>0?'fp">+ ':'fn">\u2212 ')+esc(x[0])+'</span>').join(' ');
      return '<div class="opt'+(p.done?' chosen':'')+'"><div class="ol"><b>'+esc(optLabel(p))+'</b>'+(p.done?'<em>Chosen</em>':'<small>'+(p.u>0?'+':'\u2212')+Math.abs(Math.round(p.u*100))+'</small>')+'</div>'+
        '<div class="ub"><i class="'+(p.u>=0?'pos':'neg')+'" style="width:'+sc(Math.abs(p.u))+'%"></i><s style="left:'+sc(m.bar!==undefined?m.bar:bar)+'%"></s></div>'+
        (why?'<p class="why">'+why+'</p>':'')+'</div>';
    }).join('');
  }
  const r=repOf(k);
  const ties=[];
  const names=ids=>ids.map(id=>kingdoms[id-1]).filter(o=>o&&o.alive).map(o=>esc(o.name)).join(', ');
  if(k.pacts&&k.pacts.length){const n=names(k.pacts);if(n)ties.push('Trade pacts with '+n+'.');}
  if(k.kin&&k.kin.length){const n=names(k.kin);if(n)ties.push('Royal kin in '+n+'.');}
  $('rRep').innerHTML=(r>70?'Its word is trusted by all.':r>45?'Its word is good.':r>25?'Its word is doubted.':'Its word is worthless; it has broken too many promises.')+(ties.length?' '+ties.join(' '):'');
  const mem=[];
  if(k.mem)for(const id in k.mem){
    const e=k.mem[id],o=kingdoms[id-1];if(!o||!o.alive)continue;
    if(e.g>=5)mem.push({o,v:e.g,t:(e.g>80?'Burning hatred':e.g>45?'Deep grudge':e.g>20?'Grudge':'Resentment'),why:e.why,y:e.wy,bad:true});
    if(e.d>=5)mem.push({o,v:e.d,t:(e.d>50?'Deep gratitude':e.d>20?'Gratitude':'Goodwill'),why:e.dwhy,y:e.dy,bad:false});
  }
  mem.sort((a,b)=>b.v-a.v);
  $('rMem').innerHTML=mem.length?mem.slice(0,7).map(e=>'<div class="mem'+(e.bad?' bad':'')+'"><i style="background:'+e.o.color+'"></i><span><b>'+esc(e.o.name)+'</b> '+(e.why?esc(e.why)+(e.y?' (year '+e.y+')':''):'')+'</span><span class="lvl">'+e.t+'</span></div>').join(''):'<p class="fine">No old wrongs or debts weigh on this ruler.</p>';
}

/* ---------- sheets ---------- */
let sheetMode='',sheetK=null,sheetTimer=0,seedText='',confirmNew=0;
function openSheet(mode,k){
  sheetMode=mode;sheetK=k||null;
  $('sheet').hidden=false;$('sheetBack').hidden=mode!=='realm';
  $('sheetTitle').textContent=mode==='realms'?'Realms':mode==='realm'?k.name:mode==='chronicle'?'Chronicle':mode==='history'?'History of the world':'Settings';
  $('realmBtn').setAttribute('aria-expanded',String(mode==='realms'||mode==='realm'));
  buildSheet();
  clearInterval(sheetTimer);
  if(mode!=='settings')sheetTimer=setInterval(refreshSheet,1200);
}
function closeSheet(){sheetMode='';$('sheet').hidden=true;clearInterval(sheetTimer);$('realmBtn').setAttribute('aria-expanded','false');}
function optRow(label,key,opts){
  return '<div class="row"><span>'+label+'</span><div class="opts" data-key="'+key+'">'+
    opts.map(o=>'<button data-v="'+o[0]+'" aria-pressed="'+(String(S[key])===String(o[0]))+'">'+o[1]+'</button>').join('')+'</div></div>';
}
const ONOFF=[['true','On'],['false','Off']],NAT_OPTS=[['peaceful','Peaceful'],['average','Average'],['warlike','Warlike']];

      '<h3>How it sees its neighbours</h3><div id="rRel"></div>'+

  }else if(sheetMode==='chronicle'){

  }else if(sheetMode==='history'){
    body.innerHTML='<dl id="hTiles" class="tiles"></dl>'+

      '<h3>Wonders of the world</h3><div id="hWonders"></div>';
  }else{
    body.innerHTML='<h3>This world</h3>'+
      optRow('Graphics','gfx',[['hd','HD'],['classic','Classic']])+optRow('Sharpness','quality',[['fast','Fast'],['balanced','Balanced'],['sharp','Sharp']])+
      optRow('Day and night','night',ONOFF)+optRow('Seasons','seasons',ONOFF)+optRow('Weather','weather',ONOFF)+optRow('Clouds','clouds',ONOFF)+optRow('Contour lines','contours',ONOFF)+optRow('Names on the map','labels',ONOFF)+
      optRow('Realm borders','borders',ONOFF)+optRow('Minimap','minimap',ONOFF)+optRow('Trees and peaks up close','detail',ONOFF)+
      optRow('Disasters','disasters',[['off','Off'],['rare','Rare'],['wild','Wild']])+
      optRow('Temper of the times','mood',[['gentle','Gentle'],['normal','Normal'],['bloodthirsty','Bloodthirsty']])+
      optRow('Population limit','popcap',[['small','Small'],['normal','Normal'],['large','Large']])+
      '<h3>How to play</h3><p class="note">Raise land and paint the world with the Shape and Paint tools. Drop a few people from the Life tab on good land and they will found a realm. Speed time up and watch it grow through nine ages, from huts to cities and rockets. Tap Watch to let the camera follow the action.</p>'+
      '<h3>Sound</h3>'+optRow('Sound','sound',ONOFF)+optRow('Music','music',ONOFF)+

      optRow('Climate','climate',[['cold','Cold'],['temperate','Temperate'],['hot','Hot']])+

function refreshSheet(){
  if(!sheetMode||sheetMode==='settings')return;
  if(sheetMode==='realms'){
    const list=$('realmList');if(!list)return;
    const alive=kingdoms.filter(k=>k.alive);
    if(!alive.length){list.innerHTML='<p class="note">No realms yet. Drop one of the four peoples on dry land and give them a moment.</p>';return;}
    for(const k of alive)k.pop=kPop(k);
    alive.sort((a,b)=>b.pop-a.pop);
    list.innerHTML=alive.map(k=>{
      const vs=k.villages.length,st=k.wars.size?'At war':k.allies.size?'Allied':'At peace';
      return '<button class="realm" data-k="'+k.id+'"><i style="background:'+k.color+'"></i><span class="rn">'+esc(k.name)+'</span>'+
        '<span class="rs'+(k.wars.size?' hot':'')+'">'+st+'</span><span class="rm">'+(natOf(k)!==1?cap1(NATURES[natOf(k)])+' '+SPEC[k.race].pl.toLowerCase():SPEC[k.race].pl)+', '+fmtPop(kCitizens(k))+' people, '+vs+(vs===1?' town, ':' towns, ')+AGE_NAME[k.age]+'</span>'+
        '<span class="rm rg">'+esc(rulerName(k))+': '+esc(lc1(goalText(k.goal)))+'</span></button>';
    }).join('');
  }else if(sheetMode==='realm'){
    const k=sheetK;if(!$('rStats'))return;
    if(!k.alive){$('sheetBody').innerHTML='<p class="note">The realm of '+esc(k.name)+' has fallen.</p>';return;}
    const tr=k.ruler.trait;
    $('rRuler').textContent=rulerName(k)+' '+tr.adj;
    $('rNature').textContent='Ruler of the '+SPEC[k.race].pl.toLowerCase()+' of '+k.name+', '+tr.word;
    $('rStats').innerHTML='<div><dt>People</dt><dd>'+fmtPop(kCitizens(k))+'</dd></div><div><dt>Towns</dt><dd>'+k.villages.length+'</dd></div><div><dt>Age</dt><dd>'+AGES[k.age]+'</dd></div>'+
      '<div><dt>Gold</dt><dd>'+(k.gold|0)+'</dd></div><div><dt>Soldiers</dt><dd>'+k.nSold+'</dd></div><div><dt>Allies</dt><dd>'+k.allies.size+'</dd></div>';
    $('rFocus').textContent=FOCUS_WORD[k.focus]+(k.broke?'. The treasury is empty.':'.');
    mindHtml(k);
    {
      const nt=Math.min(k.tech,TECH_LORE.length),lo=nt?TECH_LORE[nt-1]:0,hi=TECH_LORE[Math.min(nt,TECH_LORE.length-1)];
      const pct=nt>=TECH_LORE.length?100:Math.max(0,Math.min(100,Math.round((k.lore-lo)/(hi-lo)*100)));
      $('rAgeH').textContent=AGE_NAME[k.age]+(k.colony?', among the stars':'');
      $('rMeter').style.width=pct+'%';$('rMeterW').setAttribute('aria-label','Research '+pct+' percent');
      $('rTechNow').textContent=nt>=TECH_LORE.length?'Every discovery has been made.':'Now studying '+TECHS[(nt/3)|0][nt%3]+', '+pct+'% of the way'+(k.age<AGES.length-1&&nt%3===2?'. It will open the '+AGE_NAME[k.age+1]:'');
      let h='';for(let n=0;n<nt;n++)h+='<span'+(n>=nt-1?' class="new"':'')+'>'+TECHS[(n/3)|0][n%3]+'</span>';
      $('rTechs').innerHTML=h;
      const ws=[];for(const v of k.villages)if(v.wonder)ws.push(WMAP[v.wonder.wid].n.replace(/^the /,'')+' in '+esc(v.name)+(v.wonder.prog<1?' (being built, '+Math.round(v.wonder.prog*100)+'%)':''));
      $('rWonders').innerHTML=ws.length?'<h3>Wonders</h3><p class="note">'+ws.map(cap1).join('<br>')+'</p>':'';
      const vs=k.villages.slice().sort((a,b)=>b.pop-a.pop).slice(0,12);
      $('rTowns').innerHTML=vs.map(v=>'<button class="town" data-v="'+v.id+'"><b>'+esc(v.name)+(v===k.villages[0]?' \u{1F451}':'')+'</b><small>'+settlementWord(v)+', '+fmtPop(citizens(v))+' people</small></button>').join('')+(k.villages.length>12?'<p class="fine">and '+(k.villages.length-12)+' more</p>':'');
    }
    const rows=[],seen=new Set();
    const add=o=>{
      if(!o.alive||o===k||seen.has(o))return;seen.add(o);
      const st=k.wars.has(o)?'At war':k.allies.has(o)?'Allied':inTruce(k,o)?'Truce':cap1(relWord(rel(k,o)));
      rows.push('<button class="realm slim" data-k="'+o.id+'"><i style="background:'+o.color+'"></i><span class="rn">'+esc(o.name)+'</span><span class="rs'+(k.wars.has(o)?' hot':'')+'">'+st+'</span></button>');
    };
    for(const o of k.wars)add(o);for(const o of k.allies)add(o);
    for(const n of k.nb){if(rows.length>=9)break;add(n.k);}
    $('rRel').innerHTML=rows.length?rows.join(''):'<p class="note">No neighbours within reach yet.</p>';
  }else if(sheetMode==='history'){
    drawHistory();
  }else if(sheetMode==='chronicle'){
    if(!chronDirty)return;chronDirty=false;
    const list=$('chronList');if(!list)return;
    if(!chronicle.length){list.innerHTML='<p class="note">Nothing worth writing down has happened yet.</p>';return;}
    let h='';
    for(let n=chronicle.length-1,c=0;n>=0&&c<160;n--,c++){const e=chronicle[n],go=e.x!==undefined;h+='<div class="ev t-'+(e.type||'x')+(go?' go" role="button" tabindex="0" data-n="'+n:'')+'"><span>Year '+e.y+(go?' <b class="go-ico" aria-label="show on map">\u{1F4CD}</b>':'')+'</span><p>'+esc(e.text)+'</p></div>';}
    list.innerHTML=h;
  }
}
$('sheetClose').addEventListener('click',closeSheet);
$('stopWatch').addEventListener('click',()=>setWatch(false));
$('info').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='followBtn'&&inspected){follow=inspected;glide=null;cam.z=clampZ(Math.max(cam.z,12));hideInfo();toast('Following. Drag the map to stop.');}
});
$('sheetBack').addEventListener('click',()=>openSheet('realms'));
$('realmBtn').addEventListener('click',()=>{if(sheetMode==='realms'||sheetMode==='realm')closeSheet();else openSheet('realms');});
$('sheetBody').addEventListener('input',e=>{if(e.target.id==='seedIn')seedText=e.target.value;});
$('sheetBody').addEventListener('click',e=>{
  const t=e.target;
  const town=t.closest('.town');
  if(town){const v=vById[+town.dataset.v];if(v&&v.alive){camTo(v.x,v.y,Math.max(cam.z,11),1200);closeSheet();}return;}
  const ev=t.closest('.ev.go');
  if(ev){const e=chronicle[+ev.dataset.n];if(e&&e.x!==undefined){camTo(e.x,e.y2,Math.max(cam.z,10),1200);closeSheet();}return;}
  const realm=t.closest('.realm');
  if(realm){const k=kingdoms[+realm.dataset.k-1];if(k&&k.alive)openSheet('realm',k);return;}
  const ob=t.closest('.opts button');
  if(ob){
    const key=ob.parentNode.dataset.key;let v=ob.dataset.v;
    S[key]=typeof DEF[key]==='boolean'?v==='true':v;saveSettings();
    for(const b of ob.parentNode.children)b.setAttribute('aria-pressed',String(b===ob));
    if(key==='borders')dirtyAll=true;
    if(key==='gfx')switchGfx();
    if(key==='sound'&&typeof AU!=='undefined'){AU.unlock();AU.setOn(S.sound);}
    if(key==='music'&&typeof AU!=='undefined')AU.setMusic(S.music);
    if(key==='quality')resize();
    if(key==='weather'&&!S.weather)storms.length=0;
    if(key==='minimap')mini.hidden=!S.minimap;
    return;
  }
  const btn=t.closest('button');if(!btn)return;
  if(btn.dataset.save){saveWorld(btn.dataset.save).then(()=>savesHtml(h=>{const el=$('saves');if(el)el.innerHTML=h;}));return;}
  if(btn.dataset.load){closeSheet();loadWorld(btn.dataset.load);return;}
  if(btn.dataset.wh){
    const k=sheetK;if(!k||!k.alive)return;
    const r=whisper(k,btn.dataset.wh),el=$('rReply');
    if(el)el.textContent=r.busy?r.text:rulerName(k)+(r.ok?' heeds the heavens: ':' refuses: ')+'\u201c'+(r.text||'')+'\u201d';
    return;
  }
  if(btn.id==='rGo'){const k=sheetK;if(k&&k.villages.length){camTo(k.villages[0].x,k.villages[0].y,Math.max(cam.z,9),1200);closeSheet();}}
  else if(btn.id==='newBtn'){
    if(Date.now()-confirmNew<3500){confirmNew=0;closeSheet();startWorld();}
    else{confirmNew=Date.now();btn.textContent='Tap again to replace this world';setTimeout(()=>{if(btn.isConnected)btn.textContent='Create new world';},3500);}
  }
});

/* ---------- tools ---------- */
const sw=t=>'rgb('+TD[t].c.join(',')+')';
const land=(label,t)=>({id:'l'+t,label,sw:sw(t),mode:'brush',tile:t});
const CATS=[
  {label:'World',tools:[

const ptrs=new Map();let gesture=null,stroke=null;

function paintAt(p,first){
  const t=toTile(p);
  if(tool.mode==='brush'){
    const again=AGAIN[tool.id]===1;
    if(stroke.ltx===null)applyBrush(t.x,t.y,tool);
    else if(t.x!==stroke.ltx||t.y!==stroke.lty||again){
      const dx=t.x-stroke.ltx,dy=t.y-stroke.lty,steps=Math.max(1,Math.abs(dx),Math.abs(dy));
      for(let s=1;s<=steps;s++)applyBrush(Math.round(stroke.ltx+dx*s/steps),Math.round(stroke.lty+dy*s/steps),tool);
    }
    stroke.ltx=t.x;stroke.lty=t.y;
  }else if(first||Math.hypot(t.x-stroke.spx,t.y-stroke.spy)>=Math.max(1.5,brush*.8)){
    spawnBrush(t.x,t.y,tool.type);stroke.spx=t.x;stroke.spy=t.y;
  }
}
const AGAIN={rain:1,fire:1,bless:1,raise:1,lower:1,flatten:1,warm:1,cool:1,wet:1,dry:1,plant:1,smooth:1,ridge:1,valley:1,terrace:1,roughen:1,erode:1};
/* holding a shaping brush still keeps working the ground */
function holdBrush(){
  if(!stroke||!stroke.paint||stroke.multi||tool.mode!=='brush'||!AGAIN[tool.id]||stroke.ltx===null)return;
  const t=now();if(t-(stroke.lastHold||0)<120)return;stroke.lastHold=t;
  applyBrush(stroke.ltx,stroke.lty,tool);
}
function tapAt(p){
  const t=toTile(p),ok=inB(t.x,t.y);
  switch(tool.id){
    case'spring':if(ok)snd('water',t.x,t.y,.8);if(ok&&makeRiver(t.x,t.y))chron('A new river springs from the earth'+nearName(t.x,t.y),'disaster',{x:t.x,y:t.y});break;
    case'flood':snd('water');if(seaGoal<SL)seaGoal=SL;if(seaGoal>=118){toast('The seas can rise no higher.');break;}seaGoal=Math.min(118,seaGoal+6);chron('The heavens open and the seas begin to rise','disaster');break;
    case'ebb':if(seaGoal>SL)seaGoal=SL;if(seaGoal<=82){toast('The seas can fall no lower.');break;}seaGoal=Math.max(82,seaGoal-6);chron('The seas draw back from the shores','disaster');break;
    case'storm':if(ok){storms.push({x:t.x,y:t.y,r:5+brush*1.5,t:0,life:(3+Math.random()*4)*YEAR|0,thunder:true,id:uid++});chron('A great storm gathers'+nearName(t.x,t.y),'disaster',{x:t.x,y:t.y});}break;
    case'inspect':inspect(t.x,t.y);break;
    case'bolt':strike(t.x,t.y);break;
    case'bomb':if(ok)blast(t.x,t.y,4,false);break;
    case'meteor':if(ok)fx({k:'meteor',x:t.x,y:t.y,t:28});break;
    case'tornado':if(ok)twisters.push({x:Math.max(1,Math.min(W-2,t.x)),y:Math.max(1,Math.min(H-2,t.y)),dx:Math.random()<.5?1:-1,dy:0,t:170});break;
    case'volcano':if(t.x>3&&t.y>3&&t.x<W-4&&t.y<H-4)erupt(t.x,t.y);break;
    case'war':stirWar(t.x,t.y);break;
    case'peace':calmRealm(t.x,t.y);break;
  }
}

    return;
  }
  if(ptrs.size>=2&&gesture){
    const a=[...ptrs.values()],mx=(a[0].x+a[1].x)/2,my=(a[0].y+a[1].y)/2,d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1;
    const wx=cam.x+gesture.mx/cam.z,wy=cam.y+gesture.my/cam.z;
    cam.z=clampZ(cam.z*d/gesture.d);cam.x=wx-mx/cam.z;cam.y=wy-my/cam.z;
    gesture.mx=mx;gesture.my=my;gesture.d=d;clampCam();return;
  }
  if(ptrs.size===1&&stroke&&!stroke.multi){
    const dx=p.x-stroke.lx,dy=p.y-stroke.ly;stroke.moved+=Math.abs(dx)+Math.abs(dy);
    if(stroke.paint)paintAt(p,false);
    else{cam.x-=dx/cam.z;cam.y-=dy/cam.z;clampCam();if(stroke.moved>12)follow=null;}
    stroke.lx=p.x;stroke.ly=p.y;
  }
});
function pointerEnd(e){
  if(!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId);ptrs.delete(e.pointerId);

}

/* ================= history of the world: stat tiles, a chart and the wonders ================= */
let histHover=-1;
function histSeries(){
  /* the realms that mattered most: the largest ever, up to six; colour follows each realm */
  const ks=kingdoms.filter(k=>k.hist.length>1).sort((a,b)=>b.peak-a.peak).slice(0,6);
  return ks;
}
function drawHistory(chartOnly){
  const cvh=$('hChart');if(!cvh)return;
  if(!chartOnly)histPanels();
  drawHistChart(cvh);
}
function histPanels(){
  let tot=0,realms=0,wars2=0,best=-1;
  for(const k of kingdoms)if(k.alive){realms++;tot+=kCitizens(k);if(k.wars.size)wars2++;if(k.age>best)best=k.age;}
  const wn=Object.keys(wonderOf).filter(id=>wonderOf[id].prog>=1).length;
  $('hTiles').innerHTML='<div><dt>People in the world</dt><dd>'+fmtPop(tot)+'</dd></div><div><dt>Realms standing</dt><dd>'+realms+'</dd></div>'+
    '<div><dt>Most advanced</dt><dd style="font-size:17px">'+(best<0?'None yet':AGE_NAME[best])+'</dd></div><div><dt>Wonders standing</dt><dd>'+wn+' of '+WONDERS.length+'</dd></div>';
  const ks=histSeries();
  $('hLegend').innerHTML=ks.map(k=>'<span><i style="background:'+k.color+'"></i>'+esc(k.name)+(k.alive?'':' (fallen)')+'</span>').join('');
  const ink=getComputedStyle(document.body).getPropertyValue('--ink').trim()||'#12263f',muted=getComputedStyle(document.body).getPropertyValue('--muted').trim()||'#4d6577';
  const lead=kingdoms.filter(k=>k.alive).sort((a,b)=>kCitizens(b)-kCitizens(a)).slice(0,8);
  $('hLead').innerHTML=lead.map(k=>'<tr><td><span style="display:inline-block;width:10px;height:10px;background:'+k.color+';border:1px solid '+ink+';margin-right:5px"></span>'+esc(k.name)+'</td><td>'+AGES[k.age]+'</td><td class="n">'+fmtPop(kCitizens(k))+'</td><td class="n">'+k.villages.length+'</td></tr>').join('');
  $('hWonders').innerHTML=WONDERS.map(wd=>{
    const b=wonderOf[wd.id];
    if(!b)return'<p class="note">'+cap1(wd.n)+': <span style="color:'+muted+'">not yet raised ('+AGE_NAME[wd.age]+')</span></p>';
    return'<button class="town" data-v="'+b.v.id+'"><b>'+cap1(wd.n)+'</b><small>'+(b.prog<1?'Rising in ':'')+esc(b.v.name)+', '+esc(b.v.k.name)+'</small></button>';
  }).join('');
}
function drawHistChart(cvh){
  const ks=histSeries();
  const css=getComputedStyle(document.body),ink=css.getPropertyValue('--ink').trim()||'#12263f',muted=css.getPropertyValue('--muted').trim()||'#4d6577',surf=css.getPropertyValue('--panel').trim()||'#d7ebe4';
  const r=window.devicePixelRatio||1,w=cvh.clientWidth||400,h=cvh.clientHeight||230;
  if(cvh.width!==Math.round(w*r)||cvh.height!==Math.round(h*r)){cvh.width=Math.round(w*r);cvh.height=Math.round(h*r);}
  const c=cvh.getContext('2d');c.setTransform(r,0,0,r,0,0);c.clearRect(0,0,w,h);
  c.font='12px '+FONT;
  const y1=yearNow(),y0=Math.max(1,ks.reduce((m,k)=>Math.min(m,k.hist[0][0]),y1));
  if(!ks.length||y1-y0<2){c.fillStyle=muted;c.fillText('History is still being written. Come back in a few years.',8,h/2);return;}
  let vmax=10;for(const k of ks)for(const p of k.hist)if(p[1]>vmax)vmax=p[1];
  const lmax=Math.ceil(Math.log10(vmax)),lmin=1,L=40,R=78,T=8,B=22,pw=w-L-R,ph=h-T-B;
  const X=yr=>L+(yr-y0)/(y1-y0)*pw,Y=v=>T+ph-(Math.log10(Math.max(10,v))-lmin)/(lmax-lmin)*ph;
  c.strokeStyle=muted;c.globalAlpha=.25;c.lineWidth=1;
  for(let e=lmin;e<=lmax;e++){const y=Math.round(Y(Math.pow(10,e)))+.5;c.beginPath();c.moveTo(L,y);c.lineTo(L+pw,y);c.stroke();}
  c.globalAlpha=1;c.fillStyle=muted;c.textAlign='right';c.textBaseline='middle';
  for(let e=lmin;e<=lmax;e++)c.fillText(fmtPop(Math.pow(10,e)),L-6,Y(Math.pow(10,e)));
  c.textAlign='center';c.textBaseline='top';
  const step=Math.max(10,Math.pow(10,Math.floor(Math.log10(y1-y0)))/(y1-y0>300?1:2));
  for(let yr=Math.ceil(y0/step)*step;yr<=y1;yr+=step)c.fillText('Year '+yr,X(yr),h-B+6);
  /* lines: a dark casing under every realm colour keeps white and black banners visible */
  const ends=[];
  for(const k of ks){
    c.beginPath();let started=false;
    for(const p of k.hist){if(p[1]<=0){started=false;continue;}const x=X(p[0]),y=Y(p[1]);if(!started){c.moveTo(x,y);started=true;}else c.lineTo(x,y);}
    c.lineJoin='round';c.lineCap='round';

    c.strokeStyle=k.color;c.lineWidth=2;c.stroke();

    if(last)ends.push({k,x:X(last[0]),y:Y(last[1])});
  }

      tip.hidden=false;tip.style.left=Math.max(0,Math.min(w-150,histHover+10))+'px';tip.style.top='8px';
    }
  }else{const tip=$('hTip');if(tip)tip.hidden=true;}
}

/* ================= camera: glides, following, and the cinematic director ================= */
let glide=null,follow=null,watching=false,watchNext=0,hoverP=null;
/* fly the camera to a spot, easing in and out */
function camTo(x,y,z,dur){
  const tz=clampZ(z||cam.z);
  glide={fx:cam.x+vw/cam.z/2,fy:cam.y+vh/cam.z/2,fz:cam.z,tx:x,ty:y,tz,t0:now(),dur:reduceMotion?1:dur||900};
}
function stopCam(){glide=null;follow=null;if(watching)setWatch(false);}
function updCamera(dt,lerp){
  if(glide){
    const p=Math.min(1,(now()-glide.t0)/glide.dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    /* zoom out a little mid-flight on long hops so the journey reads */
    const far=Math.hypot(glide.tx-glide.fx,glide.ty-glide.fy),dip=far>40?Math.sin(p*Math.PI)*Math.min(.45,far/400):0;
    cam.z=clampZ((glide.fz+(glide.tz-glide.fz)*e)*(1-dip));
    centerOn(glide.fx+(glide.tx-glide.fx)*e,glide.fy+(glide.ty-glide.fy)*e);
    if(p>=1)glide=null;
  }else if(follow){
    const u=follow;
    if(u.dead||(u.stowed&&!u.k)){follow=null;toast('The one you were following is gone.');return;}
    const px=u.px===undefined?u.x:u.px,py=u.py===undefined?u.y:u.py;
    const fx2=px+(u.x-px)*lerp+.5,fy2=py+(u.y-py)*lerp+.5;
    const cx=cam.x+vw/cam.z/2,cy=cam.y+vh/cam.z/2,k=Math.min(1,dt/250);
    centerOn(cx+(fx2-cx)*k,cy+(fy2-cy)*k);
  }
  if(watching)director();
}
function setWatch(on){
  watching=on;document.body.classList.toggle('watching',on);
  const b=$('watchBtn');if(b){b.setAttribute('aria-pressed',String(on));}
  if(on){watchNext=0;closeSheet();hideInfo();toast('Watching the world. Touch the map to take the camera back.');}
}
/* pick something worth seeing: fresh events first, then rockets, battles, wonders, great cities */
function director(){
  const t=now();
  if(t<watchNext||glide)return;
  const c=[];
  if(lastEvent&&t-lastEvent.t<20000)c.push({x:lastEvent.x,y:lastEvent.y,w:lastEvent.type==='war'||lastEvent.type==='age'?6:4,z:9});
  for(const e of effects)if(e.k==='rocket'&&e.t>200)c.push({x:e.x,y:e.y-4,w:9,z:7});
  for(const b of raising)if(b.kind==='wonder'&&b.v.alive)c.push({x:b.x+1,y:b.y+1,w:2,z:12});
  let fights=0;
  for(let n=0;n<units.length&&fights<4;n+=7){const u=units[n];if(u.foe&&u.soldier&&u.k&&u.foe.k&&u.foe.k!==u.k){c.push({x:u.x,y:u.y,w:3,z:11});fights++;}}
  for(const u of units)if(u.t===DRAGON){c.push({x:u.x,y:u.y,w:3,z:8,u});break;}
  for(const p of planes){c.push({x:p.x,y:p.y,w:3,z:8});break;}
  for(const s of storms){c.push({x:s.x,y:s.y,w:1,z:5});break;}
  let big=null;for(let n=1;n<vById.length;n++){const v=vById[n];if(v.alive&&(!big||v.houses>big.houses))big=v;}
  if(big)c.push({x:big.x,y:big.y,w:2,z:13});
  for(let m=0;m<2;m++){const v=vById[1+((Math.random()*(vById.length-1))|0)];if(v&&v.alive)c.push({x:v.x,y:v.y,w:1,z:10+Math.random()*6});}
  if(!c.length){watchNext=t+4000;return;}
  let sum=0;for(const o of c)sum+=o.w;let r=Math.random()*sum,pick2=c[0];
  for(const o of c){r-=o.w;if(r<=0){pick2=o;break;}}
  camTo(pick2.x,pick2.y,pick2.z*(.85+Math.random()*.3),2600);
  if(lastEvent&&pick2.x===lastEvent.x)lastEvent.t=0;
  watchNext=t+9000+Math.random()*5000;
}
/* the brush outline under the pointer */
function drawCursor(ox,oy,z){
  const p=hoverP||(stroke&&stroke.paint?{x:stroke.lx,y:stroke.ly}:null);
  if(!p||busy||watching)return;
  if(tool.mode!=='brush'&&tool.mode!=='spawn'&&tool.mode!=='tap')return;
  if(tool.id==='inspect'||tool.id==='flood'||tool.id==='ebb')return;
  const t=toTile(p),px=ox+(t.x+.5)*z,py=oy+(t.y+.5)*z;
  if(tool.mode==='slider')return;
  const r=tool.mode==='tap'?.6:tool.sculpt||tool.id==='warm'||tool.id==='cool'||tool.id==='wet'||tool.id==='dry'||tool.id==='plant'?brush+.5:Math.max(.6,brush-.5);
  ctx.save();ctx.lineWidth=Math.max(1.5,dpr*1.5);
  ctx.strokeStyle='rgba(11,24,40,.7)';ctx.beginPath();ctx.arc(px,py,r*z+1.5*dpr,0,6.283);ctx.stroke();
  ctx.strokeStyle='rgba(255,236,150,.95)';ctx.beginPath();ctx.arc(px,py,r*z,0,6.283);ctx.stroke();

}
function bldName(b){

  switch(b.kind){
    case'hall':return["chieftain's hall",'great hall','castle','town hall','capitol'][t];
    case'house':return t>=3&&Math.hypot(b.x-b.v.x,b.y-b.v.y)<b.v.rad*.62?(t>=4?'tower block':'tenement'):'home';
    case'academy':return['school','library','university','university','research lab'][t];
    case'temple':return['shrine','temple','cathedral','church','monument'][t];
    case'tower':return['watchtower','watchtower','stone tower','fort','radar tower'][t];
    case'barracks':return['war camp','barracks','barracks','garrison','military base'][t];
    case'market':return['market','market','market hall','shopping street','mall'][t];

/* ===== 85-audio.js ===== */
/* ================= sound: procedural sfx, ambience beds and generative music (pure Web Audio, no files) ================= */
const AU_MASTER=.42,AU_MUSV=.5,AU_CAP=12,AU_MCAP=9;
let auC=null,auDead=false,auUnl=false,auOn=null,auMOn=null,auOffT=0,auFr=0;
let auOut=null,auSfx=null,auAmb=null,auMus=null,auVerb=null,auEcho=null,auWhite=null,auBrown=null,auKS=null,auKSf=220,auPanOK=false;
const auV=[],auLast={},auBed={};
const auSm={ocean:0,river:0,tree:0,green:0,bld:0,fire:0,lava:0,mount:0,war:0};
const auSt={era:0,war:false,night:0,zo:0,storm:0,fireL:0,pz:1,u:.31,v:.67,ck:0};
const auPts={tree:{x:[],y:[],n:0},bld:{x:[],y:[],n:0},lava:{x:[],y:[],n:0}};
const auR=(a,b)=>a+Math.random()*(b-a);
const auFin=x=>Number.isFinite(x)?x:0;
const auCl=(x,a,b)=>x<a?a:x>b?b:x;
const auMidi=m=>440*Math.pow(2,(m-69)/12);

/* ---------- node helpers: every node a voice makes is listed so it can be disconnected when the voice ends ---------- */
function auVox(dur,g,pan,send,bus,t){
  const c=auC;t=t||c.currentTime+.015;
  const o=c.createGain();o.gain.value=auFin(g);
  const V={t,end:t+dur,n:[o],o,m:bus===auMus,name:''};
  let last=o;
  if(pan&&auPanOK){const p=c.createStereoPanner();p.pan.value=auCl(auFin(pan),-1,1);o.connect(p);V.n.push(p);last=p;}
  last.connect(bus||auSfx);
  if(send>0){const s=c.createGain();s.gain.value=send;o.connect(s);s.connect(auVerb);V.n.push(s);}
  auV.push(V);return V;
}
function auO(V,type,f,t0,t1){const o=auC.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t0);o.start(t0);o.stop(t1);V.n.push(o);return o;}
function auNz(V,brown,t0,t1,rate){
  const s=auC.createBufferSource(),b=brown?auBrown:auWhite;s.buffer=b;s.loop=true;if(rate)s.playbackRate.value=rate;
  s.start(t0,Math.random()*(b.duration-.6));s.stop(t1);V.n.push(s);return s;
}
function auF(V,type,f,q){const b=auC.createBiquadFilter();b.type=type;b.frequency.value=f;if(q!==undefined)b.Q.value=q;V.n.push(b);return b;}
function auGn(V,val){const g=auC.createGain();g.gain.value=val;V.n.push(g);return g;}
function auW(){for(let i=0;i<arguments.length-1;i++)arguments[i].connect(arguments[i+1]);return arguments[0];}
/* percussive envelope: linear attack, exponential fall to silence */
function auE(p,t,a,pk,d){p.setValueAtTime(1e-4,t);p.linearRampToValueAtTime(Math.max(2e-4,pk),t+a);p.exponentialRampToValueAtTime(1e-4,t+a+d);}
function auSw(p,t,a,b,d){p.setValueAtTime(a,t);p.exponentialRampToValueAtTime(b,t+d);}
/* random wobble of a gain, for rolling rumbles */
function auRoll(p,t,d,k){p.setValueAtTime(.6,t);for(let i=1;i<=k;i++)p.linearRampToValueAtTime(auR(.3,1),t+i*d/k);}
function auPrune(now){
  let w=0;
  for(let i=0;i<auV.length;i++){const V=auV[i];if(V.end+.15<now){for(const n of V.n){try{n.disconnect();}catch(e){}}}else auV[w++]=V;}
  auV.length=w;
}
function auCount(m,name){let n=0;for(const V of auV)if(V.m===m&&(!name||V.name===name))n++;return n;}

/* ---------- buffers: one white and one brown noise, one plucked string (Karplus-Strong), made once ---------- */
function auNoise(sec,brown){
  const sr=auC.sampleRate,n=Math.floor(sr*sec),b=auC.createBuffer(1,n,sr),d=b.getChannelData(0);
  let last=0,m=0;
  for(let i=0;i<n;i++){const w=Math.random()*2-1;if(brown){last=(last+.02*w)/1.02;d[i]=last;}else d[i]=w;}
  if(brown){/* tilt so the loop joins without a step, then remove DC */
    const a=d[0],z=d[n-1];let mean=0;
    for(let i=0;i<n;i++){d[i]-=a+(z-a)*i/(n-1);mean+=d[i];}
    mean/=n;for(let i=0;i<n;i++)d[i]-=mean;
  }
  for(let i=0;i<n;i++)m=Math.max(m,Math.abs(d[i]));
  const k=.95/(m||1);for(let i=0;i<n;i++)d[i]*=k;
  return b;
}
function auMkKS(){
  const sr=auC.sampleRate,P=Math.round(sr/220),n=Math.floor(sr*2.6),b=auC.createBuffer(1,n,sr),d=b.getChannelData(0);
  auKSf=sr/P;let lp=0,mean=0,m=0;
  for(let i=0;i<P;i++){lp+=(Math.random()*2-1-lp)*.55;d[i]=lp;mean+=lp;}
  mean/=P;for(let i=0;i<P;i++)d[i]-=mean;
  for(let i=P;i<n;i++)d[i]=.4985*(d[i-P]+(i>P?d[i-P-1]:d[0]));
  for(let i=0;i<n;i++)m=Math.max(m,Math.abs(d[i]));
  const k=.9/(m||1),fo=Math.floor(sr*.05);
  for(let i=0;i<n;i++)d[i]*=k*(i>n-fo?(n-i)/fo:1);
  return b;
}

/* ---------- the graph: buses -> master -> compressor -> trim -> speakers, with a delay-network "reverb" send ---------- */
function auInit(){
  try{
    const AC=typeof window!=='undefined'&&(window.AudioContext||window.webkitAudioContext);
    if(!AC){auDead=true;return;}
    const c=auC=new AC();
    auPanOK=typeof c.createStereoPanner==='function';
    const comp=c.createDynamicsCompressor();
    comp.threshold.value=-12;comp.knee.value=10;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.3;
    const trim=c.createGain();trim.gain.value=.8;
    auOut=c.createGain();auOut.gain.value=0;
    auW(auOut,comp,trim,c.destination);
    const bus=v=>{const g=c.createGain();g.gain.value=v;g.connect(auOut);return g;};
    auSfx=bus(1);auAmb=bus(.9);auMus=bus(0);
    auWhite=auNoise(3,false);auBrown=auNoise(4,true);auKS=auMkKS();
    /* four damped feedback combs, spread across the stereo field */
    auVerb=c.createGain();
    const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=200;auVerb.connect(hp);
    const vo=bus(.26);
    [[.0797,.77,-.7],[.1131,.71,.7],[.1517,.63,-.35],[.1971,.56,.35]].forEach(a=>{
      const d=c.createDelay(.5),f=c.createBiquadFilter(),g=c.createGain();

      if(auPanOK){const p=c.createStereoPanner();p.pan.value=a[2];auW(f,p,vo);}else f.connect(vo);
    });

    auEcho=c.createGain();
    const ed=c.createDelay(1.5),ef=c.createBiquadFilter(),eg=c.createGain(),eo=bus(.5),ev=c.createGain();
    ed.delayTime.value=.45;ef.type='lowpass';ef.frequency.value=2000;eg.gain.value=.42;ev.gain.value=.25;
    auW(auEcho,ed,ef,eg,ed);ef.connect(eo);auW(ef,ev,auVerb);
    auBeds();
    if(typeof document!=='undefined')document.addEventListener('visibilitychange',()=>{
      try{if(document.hidden){if(auC.state==='running'){const p=auC.suspend();if(p&&p.catch)p.catch(()=>{});}}else if(auOn)auResume();}catch(e){}
    });
  }catch(e){auDead=!auC||!auOut||!auBrown;if(auDead)auC=null;}
}
function auResume(){
  try{
    if(auC.state!=='running'&&!(typeof document!=='undefined'&&document.hidden)){const p=auC.resume();if(p&&p.catch)p.catch(()=>{});}
  }catch(e){}
}
function auApply(){
  if(!auC)return;
  try{
    const t=auC.currentTime;

    auMus.gain.setTargetAtTime(auMOn?AU_MUSV:0,t,.5);

  }catch(e){}
}
function auStart(){

  try{const b=auC.createBuffer(1,1,22050),s=auC.createBufferSource();s.buffer=b;s.connect(auC.destination);s.start(0);}catch(e){}
}

/* ---------- ambience beds: looping noise through filters, levels steered from the world each frame ---------- */
function auBeds(){
  const c=auC;
  const mk=name=>{const out=c.createGain();out.gain.value=0;return auBed[name]={out,on:false,cur:0,z0:0};};
  const src=(brown,rate)=>{const s=c.createBufferSource(),b=brown?auBrown:auWhite;s.buffer=b;s.loop=true;s.playbackRate.value=rate;s.start(0,Math.random()*(b.duration-.6));return s;};
  const flt=(type,f,q)=>{const b=c.createBiquadFilter();b.type=type;b.frequency.value=f;if(q!==undefined)b.Q.value=q;return b;};
  const gn=v=>{const g=c.createGain();g.gain.value=v;return g;};
  const lfo=(f,...pd)=>{const o=c.createOscillator();o.frequency.value=f;for(let i=0;i<pd.length;i+=2){const g=gn(pd[i+1]);o.connect(g);g.connect(pd[i]);}o.start();return o;};

  B=mk('hiss');const hb=flt('bandpass',1300,.6),hg=gn(.6);auW(src(0,.8),hb,flt('lowpass',5000,0),hg,B.out);

  B=mk('rain');auW(src(0,1),flt('highpass',1400,0),flt('lowpass',7500,0),B.out);
  /* town murmur */
  B=mk('town');const tg=gn(.65);B.f=flt('bandpass',430,.8);auW(src(0,.5),B.f,flt('lowpass',1100,0),tg,B.out);lfo(.37,tg.gain,.22);lfo(1.3,tg.gain,.12);
  /* fire: crackle spikes on a high band plus a low roar */
  B=mk('fire');B.ck=gn(.05);B.rg=gn(.5);auW(src(0,1.1),flt('highpass',1900,0),B.ck,B.out);auW(src(1,1.3),flt('lowpass',380,0),B.rg,B.out);

  B=mk('lava');const ll=flt('lowpass',150,4),lg=gn(.7);auW(src(1,.55),ll,lg,B.out);lfo(.23,lg.gain,.28);lfo(.09,ll.frequency,40);

    const pw=c.createPeriodicWave(re,im,{disableNormalization:true});

      const car=c.createOscillator(),am=gn(.5),gate=gn(du),go=c.createOscillator();
      car.frequency.value=a[0];lfo(a[1],am.gain,.5);go.setPeriodicWave(pw);go.frequency.value=a[2];go.connect(gate.gain);
      auW(car,am,gate);
      if(auPanOK){const p=c.createStereoPanner();p.pan.value=a[3];auW(gate,p,B.out);}else gate.connect(B.out);
      car.start();go.start();
    });
  }catch(e){}
}
function auBedLvl(k,lvl,now){
  const B=auBed[k];if(!B)return;

/* ---------- reading the world: a rotating low-discrepancy sample of the visible tiles ---------- */
function auPush(P,x,y){const k=P.n++&7;P.x[k]=x;P.y[k]=y;}
function auPick(P){if(!P.n)return null;const k=Math.random()*Math.min(8,P.n)|0;return[P.x[k]+Math.random(),P.y[k]+Math.random()];}
function auScan(dt){
  const st=auSt,z=Math.max(.05,auFin(cam.z)||1),tw=vw/z,th=vh/z,c=[0,0,0,0,0,0,0,0,0];
  st.zo=auCl((6-z)/5,0,1);st.night=auCl(auFin(nightF),0,1);st.pz=speed===0?.5:1;
  let K=0;
  if(W>0&&H>0&&tile){
    const x0=Math.max(0,Math.floor(cam.x)),y0=Math.max(0,Math.floor(cam.y)),x1=Math.min(W,Math.ceil(cam.x+tw)),y1=Math.min(H,Math.ceil(cam.y+th)),w=x1-x0,h=y1-y0;
    if(w>0&&h>0){
      K=Math.min(240,w*h);
      for(let k=0;k<K;k++){
        st.u+=.7548776662466927;if(st.u>=1)st.u-=1;st.v+=.5698402909980532;if(st.v>=1)st.v-=1;
        const x=x0+(st.u*w|0),y=y0+(st.v*h|0),i=y*W+x,t=tile[i];
        if(t<=WATER)c[0]++;
        else if(t===RIVER)c[1]++;
        else if(t===FOREST||t===JUNGLE||t===PINE){c[2]++;if(Math.random()<.05)auPush(auPts.tree,x,y);}
        else if(t===GRASS||t===SAVANNA||t===SWAMP){c[3]++;if(Math.random()<.01)auPush(auPts.tree,x,y);}
        else if(t===LAVA){c[6]++;if(Math.random()<.2)auPush(auPts.lava,x,y);}
        else if(t===MOUNT||t===SNOW)c[7]++;
        const b=bmap&&bmap[i];
        if(b){c[4]++;if(Math.random()<.1)auPush(auPts.bld,x,y);const kk=b.v&&b.v.k;if(kk&&kk.wars&&kk.wars.size)c[8]++;}
        if(fire&&fire[i])c[5]++;
      }
    }
  }
  const a=1-Math.exp(-dt/900),sm=auSm,keys=['ocean','river','tree','green','bld','fire','lava','mount','war'];
  for(let j=0;j<9;j++){const f=K?c[j]/K:0;sm[keys[j]]+=(f-sm[keys[j]])*a;}
  st.fireL=Math.min(1,Math.sqrt(sm.fire*40));
  /* storms over the view: how close, how strong, how much of the screen they cover */
  let s=0;
  if(storms&&storms.length)for(const S2 of storms){
    const amt=Math.min(1,S2.t/120,(S2.life-S2.t)/120);if(!(amt>0))continue;
    const qx=auCl(S2.x,cam.x,cam.x+tw),qy=auCl(S2.y,cam.y,cam.y+th),d=Math.hypot(S2.x-qx,S2.y-qy),r=Math.max(1,S2.r||6);
    const ov=d<r?1:Math.max(0,1-(d-r)/(r*1.5));if(!(ov>0))continue;
    s=Math.max(s,amt*ov*(.35+.65*Math.min(1,Math.PI*r*r/Math.max(1,tw*th)*1.5)));
  }
  st.storm+=(auFin(s)-st.storm)*a;
}
function auMood(){
  let era=0,near=false;
  const z=Math.max(.05,auFin(cam.z)||1),tw=vw/z,th=vh/z,x0=cam.x-tw*.5,x1=cam.x+tw*1.5,y0=cam.y-th*.5,y1=cam.y+th*1.5;
  if(kingdoms)for(const k of kingdoms){
    if(!k||!k.alive)continue;
    if(k.age>era)era=k.age;
    if(!near&&k.wars&&k.wars.size>0&&k.villages)for(const v of k.villages)if(v&&v.x>=x0&&v.x<=x1&&v.y>=y0&&v.y<=y1){near=true;break;}
  }

}
function auBedsSet(now){
  const s=auSm,st=auSt,zo=st.zo,nf=st.night,pz=st.pz,oc=Math.pow(s.ocean,.6);
  auBedLvl('surf',.3*oc*(1-.35*zo)*pz,now);

  auBedLvl('wind',Math.min(.4,.05+.11*zo+.1*s.mount+.26*st.storm)*pz,now);

  auBedLvl('crk',.035*nf*Math.min(1,(s.tree+s.green)*1.6)*(1-.5*zo)*pz,now);
  auBedLvl('town',.14*Math.min(1,s.bld*4)*(.3+.7*(1-zo))*(1-.4*nf)*pz,now);

  try{

    auBed.fire.rg.gain.setTargetAtTime(.25+.75*st.fireL,now,.5);

function auEvents(ds,now){

  r=1.1*Math.min(1,s.bld*4)*(1-zo)*(1-.85*nf)*(pz<1?0:1);
  if(cam.z>=3&&Math.random()<r*ds){const p=auPick(auPts.bld);if(p)AU.sfx('build',p[0],p[1],auR(.2,.4));}
  r=1.4*Math.min(1,Math.sqrt(s.lava*10))*pz;
  if(Math.random()<r*ds){const p=auPick(auPts.lava);if(p)AU.sfx('_lava',p[0],p[1],auR(.4,1));}
  const B=auBed.fire;
  if(B&&B.on&&st.fireL>.01){
    if(st.ck<now+.02)st.ck=now+.02;
